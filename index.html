<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>群友打飞机 · 双人合作</title>
<style>
:root {
  --bg: #070612;
  --accent: #ff7ec8;
  --accent2: #7ed0ff;
  --gold: #ffd76a;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: var(--bg); color: #e9e6ff;
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  overflow: hidden;
}
#wrap {
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 12px;
}
#stage { position: relative; }
canvas {
  background: #05030f; border-radius: 6px;
  box-shadow: 0 0 40px rgba(120,80,200,.3);
  max-width: 100vw; max-height: 70vh; width: auto; height: auto;
  aspect-ratio: 480/720; touch-action: none;
}
.hidden { display: none !important; }

#lobby {
  width: min(480px, 96vw); padding: 20px;
  background: rgba(10,8,30,.92); border-radius: 12px;
  border: 1px solid rgba(255,255,255,.12);
}
#lobby h1 {
  margin: 0 0 4px; font-size: 22px; text-align: center;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
#lobby .sub { text-align: center; font-size: 12px; color: #8a83b8; margin-bottom: 16px; }
.status { font-size: 13px; color: #b9b3e6; text-align: center; min-height: 1.4em; margin-bottom: 12px; }
.status.ok { color: #9cff6a; }
.status.warn { color: #ff9a6a; }

.btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
.btn {
  padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer;
  border: none; border-radius: 24px; color: #1a0a1f;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
}
.btn.secondary { background: rgba(255,255,255,.12); color: #fff; }
.btn.small { padding: 6px 12px; font-size: 12px; }

.panel { margin-top: 12px; }
.panel label { display: block; font-size: 12px; color: #9a93c8; margin: 8px 0 4px; }
.panel textarea {
  width: 100%; min-height: 72px; font-size: 11px; font-family: monospace;
  background: #0f0c22; color: #cfe; border: 1px solid #3a3560; border-radius: 6px;
  padding: 8px; resize: vertical;
}
.help { font-size: 11px; color: #6a6398; line-height: 1.6; margin-top: 10px; }
.file-banner {
  background: rgba(255,120,80,.15); border: 1px solid rgba(255,150,100,.45);
  border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #ffccaa;
  line-height: 1.55; margin-bottom: 12px; text-align: left;
}

#hud { margin-top: 8px; font-size: 11px; color: #6a6398; text-align: center; max-width: 480px; }
#touchUI { position: fixed; inset: 0; pointer-events: none; display: none; }
body.touch #touchUI { display: block; }
.tbtn {
  position: absolute; pointer-events: auto; right: 14px; width: 64px; height: 64px;
  border-radius: 50%; border: 2px solid rgba(255,255,255,.5);
  background: rgba(30,20,60,.55); color: #fff; font-size: 12px; font-weight: 700;
}
#btnWeapon { bottom: 88px; }
#btnBomb { bottom: 14px; border-color: rgba(255,150,200,.8); }

</style>
</head>
<body>
<div id="wrap">
  <div id="lobby">
    <h1>群友打飞机 · 双人合作</h1>
    <p class="sub">单文件版 · 浏览器直连 · 无需游戏服务器</p>
    <div id="fileBanner" class="file-banner hidden">
      ⚠ 联机需要 <strong>http://localhost</strong> 或 <strong>https</strong> 打开。
      可运行同目录 <strong>本地启动.bat</strong>，然后访问 http://localhost:8080
    </div>
    <p id="status" class="status">加载中…</p>
    <div id="rolePick" class="btn-row">
      <button class="btn" id="btnPickHost">创建房间（主机）</button>
      <button class="btn secondary" id="btnPickGuest">加入房间（队友）</button>
    </div>
    <div id="hostPanel" class="panel hidden">
      <p class="help"><strong>主机：</strong>① 生成邀请码 → ② 发给队友 → ③ 粘贴应答码 → ④ 开始</p>
      <label>邀请码（发给队友）</label>
      <textarea id="inviteOut" readonly placeholder="点击生成…"></textarea>
      <div class="btn-row">
        <button class="btn small" id="btnGenInvite">生成邀请码</button>
        <button class="btn small secondary" id="btnCopyInvite">复制</button>
      </div>
      <label>应答码（队友发回来的）</label>
      <textarea id="answerIn" placeholder="粘贴应答码…"></textarea>
      <div class="btn-row">
        <button class="btn small" id="btnComplete">完成连接</button>
        <button class="btn hidden" id="btnStart">开始游戏</button>
      </div>
    </div>
    <div id="guestPanel" class="panel hidden">
      <p class="help"><strong>队友：</strong>① 粘贴邀请码 → ② 生成应答码 → ③ 发回主机</p>
      <label>邀请码（主机发来的）</label>
      <textarea id="inviteIn" placeholder="粘贴邀请码…"></textarea>
      <div class="btn-row">
        <button class="btn small" id="btnGenAnswer">生成应答码</button>
      </div>
      <label>应答码（发回给主机）</label>
      <textarea id="answerOut" readonly placeholder="生成后复制…"></textarea>
      <div class="btn-row">
        <button class="btn small secondary" id="btnCopyAnswer">复制应答码</button>
      </div>
    </div>
  </div>
  <div id="stage">
    <canvas id="game" width="480" height="720"></canvas>
    <div id="touchUI">
      <button id="btnWeapon" class="tbtn">武器</button>
      <button id="btnBomb" class="tbtn">大招</button>
    </div>
  </div>
  <div id="hud" class="hidden">
    P1 主机：方向键/WASD · Shift · Q · E<br>
    P2 队友：IJKL · U · P · O · 触屏拖动
  </div>
</div>
<script>
window.COOP = window.COOP || {};

const W = 480;
const H = 720;
const TAU = Math.PI * 2;

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const dist2 = (ax, ay, bx, by) => {
  const dx = ax - bx, dy = ay - by;
  return dx * dx + dy * dy;
};

const WEAPONS = ['散弹', '速射', '光波'];
const WEAPON_HINT = ['贴脸爆发', '集中点射', '贯穿清列'];

const ACTS = [
  { waves: 8, spawnMin: 55, spawnMax: 95, types: ['fairy', 'shooter'] },
  { waves: 10, spawnMin: 45, spawnMax: 80, types: ['fairy', 'shooter', 'spiral'] },
  { waves: 12, spawnMin: 38, spawnMax: 70, types: ['fairy', 'shooter', 'spiral'] },
];

const PHASE_NAMES = [
  ['星环咏唱', '三重魔阵', '星界崩裂'],
  ['铁拳试探', '左右连击', '暴怒乱拳'],
  ['山河镇守', '拳风卷刃', '镇山一击'],
];

const BOSS_NAMES = ['闻白 · 星界咏唱', '私教 · 铁拳教头', '薛埠王 · 拳镇山河'];
const BOSS_HP = [300, 450, 640];

function makePlayer(id) {
  const offset = id === 0 ? -36 : 36;
  return {
    id,
    x: W / 2 + offset,
    y: H - 110,
    r: 2.6,
    grazeR: 24,
    speed: 4.2,
    boostSpeed: 7.2,
    weapon: 0,
    inv: 0,
    fireCd: 0,
    lives: 3,
    bombs: 3,
    dead: false,
    tint: id === 0 ? '#7ed0ff' : '#9cff6a',
    accent: id === 0 ? '#e23b6a' : '#ffd76a',
  };
}

function createGameState() {
  const stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({ x: rand(0, W), y: rand(0, H), r: rand(0.4, 1.6), s: rand(8, 26), a: rand(0.3, 1) });
  }
  return {
    state: 'playing',
    score: 0,
    graze: 0,
    bombGauge: 0,
    time: 0,
    spawnTimer: 30,
    waveCount: 0,
    bossActive: false,
    bossesDefeated: 0,
    act: 0,
    shake: 0,
    pBullets: [],
    pShots: [],
    enemies: [],
    particles: [],
    floaters: [],
    stars,
    boss: null,
    players: [makePlayer(0), makePlayer(1)],
    spellAnim: null,
    win: false,
    nextEnemyId: 1,
  };
}

COOP.util = {
  W, H, TAU, rand, randi, clamp, dist2,
  WEAPONS, WEAPON_HINT, ACTS, PHASE_NAMES, BOSS_NAMES, BOSS_HP,
  makePlayer, createGameState,
};

const {
  W, H, TAU, rand, randi, clamp, dist2,
  WEAPONS, ACTS, PHASE_NAMES, BOSS_NAMES, BOSS_HP,
  makePlayer, createGameState,
} = COOP.util;

/**
 * 主机侧游戏引擎 — 完整模拟，访客只收快照
 */
class GameEngine {
  constructor() {
    this.g = createGameState();
    /** @type {[InputState, InputState]} */
    this.inputs = [{}, {}];
  }

  reset() {
    this.g = createGameState();
    this.inputs = [{}, {}];
  }

  setInput(playerId, input) {
    if (playerId >= 0 && playerId < 2) this.inputs[playerId] = { ...input };
  }

  nearestPlayer(x, y) {
    let best = this.g.players[0];
    let bd = Infinity;
    for (const p of this.g.players) {
      if (p.dead || p.lives <= 0) continue;
      const d = dist2(x, y, p.x, p.y);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }

  alivePlayers() {
    return this.g.players.filter(p => !p.dead && p.lives > 0);
  }

  spawnBullet(x, y, vx, vy, color, r = 4, type = 'pellet') {
    this.g.pBullets.push({ x, y, vx, vy, color, r, type, spin: rand(0, TAU) });
  }

  fireAimed(x, y, spd, color, r, type) {
    const p = this.nearestPlayer(x, y);
    const a = Math.atan2(p.y - y, p.x - x);
    this.spawnBullet(x, y, Math.cos(a) * spd, Math.sin(a) * spd, color, r, type);
  }

  fireFan(x, y, n, spread, spd, baseA, color, r, type) {
    for (let i = 0; i < n; i++) {
      const a = baseA - spread / 2 + spread * (i / (n - 1 || 1));
      this.spawnBullet(x, y, Math.cos(a) * spd, Math.sin(a) * spd, color, r, type);
    }
  }

  fireRing(x, y, n, spd, color, r, offset = 0, type) {
    for (let i = 0; i < n; i++) {
      const a = offset + (i / n) * TAU;
      this.spawnBullet(x, y, Math.cos(a) * spd, Math.sin(a) * spd, color, r, type);
    }
  }

  fireSpiral(x, y, angle, arms, spd, color, r, type) {
    for (let i = 0; i < arms; i++) {
      const a = angle + (i / arms) * TAU;
      this.spawnBullet(x, y, Math.cos(a) * spd, Math.sin(a) * spd, color, r, type);
    }
  }

  spark(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), sp = rand(0.5, 3.5);
      this.g.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: randi(14, 30), max: 30, color, r: rand(1, 2.6) });
    }
  }

  addScore(n, x, y, color = '#ffe57a', big = false) {
    this.g.score += n;
    this.g.floaters.push({ x, y, text: '+' + n, life: big ? 80 : 45, max: big ? 80 : 45, color, big, vy: -0.8 });
  }

  makeEnemy(type, x, y) {
    const e = {
      id: this.g.nextEnemyId++,
      x, y, type, t: 0, fireT: rand(20, 50), hp: 6, r: 14, dead: false,
      vy: rand(0.5, 1.2), vx: rand(-0.6, 0.6), hue: rand(0, 360),
    };
    if (type === 'fairy') { e.hp = 5; e.vy = rand(0.7, 1.3); }
    if (type === 'spiral') { e.hp = 14; e.vy = 0.6; e.spiral = rand(0, TAU); }
    if (type === 'shooter') { e.hp = 10; e.vy = 0.8; }
    return e;
  }

  hitShot(s, x, y, tr) {
    if (s.kind === 'wave') {
      const ang = Math.atan2(s.vy, s.vx), dx = x - s.x, dy = y - s.y;
      const ca = Math.cos(-ang), sa = Math.sin(-ang);
      const lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
      const hw = (s.hw || 14) + tr, hh = s.r + tr;
      return (lx * lx) / (hw * hw) + (ly * ly) / (hh * hh) <= 1;
    }
    return dist2(s.x, s.y, x, y) < (s.r + tr) ** 2;
  }

  applyShot(s, target, x, y, r) {
    if (s.dead || !this.hitShot(s, x, y, r)) return 0;
    if (s.pierce) {
      if (!s.hitSet) s.hitSet = new Set();
      if (s.hitSet.has(target)) return 0;
      s.hitSet.add(target);
    } else s.dead = true;
    return s.power || 1;
  }

  playerShoot(p) {
    if (p.fireCd > 0) { p.fireCd--; return; }
    const x = p.x, y = p.y;
    switch (p.weapon) {
      case 0:
        p.fireCd = 15;
        for (let i = -3; i <= 3; i++) {
          const a = -Math.PI / 2 + i * 0.09 + rand(-0.025, 0.025);
          const sp = 5.6 + Math.abs(i) * 0.15;
          this.g.pShots.push({ x: x + i * 2, y: y - 10, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 2.7, power: 1, kind: 'pellet', dead: false, owner: p.id });
        }
        this.spark(x, y - 8, '#ffe08a', 4);
        break;
      case 1:
        p.fireCd = 9;
        this.g.pShots.push({ x: x - 3, y: y - 16, vx: 0, vy: -9, r: 3.2, power: 2, kind: 'focus', dead: false, owner: p.id });
        this.g.pShots.push({ x: x + 3, y: y - 16, vx: 0, vy: -9, r: 3.2, power: 2, kind: 'focus', dead: false, owner: p.id });
        break;
      case 2:
        p.fireCd = 14;
        for (let i = -1; i <= 1; i++) {
          this.g.pShots.push({ x: x + i * 8, y: y - 12, vx: i * 0.6, vy: -5, r: 5.5, hw: 16, power: 2, kind: 'wave', pierce: true, dead: false, owner: p.id });
        }
        break;
    }
  }

  killEnemy(e) {
    e.dead = true;
    this.addScore(120, e.x, e.y);
    this.g.bombGauge = Math.min(100, this.g.bombGauge + 8);
    this.spark(e.x, e.y, 'hsl(' + e.hue + ',90%,65%)', 16);
  }

  spawnBoss(actIdx) {
    const bossHp = BOSS_HP[actIdx];
    this.g.boss = {
      x: W / 2, y: 130, t: 0, phase: 0, fireT: 40, hp: bossHp, maxhp: bossHp,
      r: [35, 32, 34][actIdx], entering: false, defeated: false, deathT: 0, act: actIdx,
      phaseFlash: 0, name: BOSS_NAMES[actIdx],
    };
    this.g.bossActive = true;
    this.g.floaters.push({ x: W / 2, y: H * 0.28, text: '⚠ BOSS 出现 ⚠', life: 60, max: 60, color: '#fff', big: true, vy: -0.2 });
  }

  updateBossFire(b) {
    const a = b.act, p = b.phase;
    const tgt = this.nearestPlayer(b.x, b.y);
    if (a === 0) {
      if (p === 0) {
        if (b.fireT <= 0) { this.fireRing(b.x, b.y, 8, 0.92, '#ff9ad4', 5.6, b.t * 0.018, 'rice'); b.fireT = 52; }
      } else if (p === 1) {
        b.patternT = (b.patternT || 0) + 0.06;
        if (b.fireT <= 0) {
          this.fireSpiral(b.x, b.y, b.patternT, 2, 1.2, '#c4a0ff', 6.2, 'star');
          this.fireAimed(b.x, b.y, 1.4, '#ffe57a', 4.4, 'pellet');
          b.fireT = 26;
        }
      } else {
        b.patternT = (b.patternT || 0) + 0.08;
        if (b.fireT <= 0) {
          this.fireRing(b.x, b.y, 10, 1.1, '#ff6ad5', 5.2, b.patternT, 'petal');
          this.fireAimed(b.x, b.y, 1.7, '#ffd76a', 5, 'knife');
          b.fireT = 22;
        }
      }
    } else if (a === 1) {
      const ang = Math.atan2(tgt.y - b.y, tgt.x - b.x);
      if (p === 0) {
        if (b.fireT <= 0) { this.fireFan(b.x, b.y, 3, 0.7, 1.5, ang, '#ffb347', 7.2, 'orb'); b.fireT = 44; }
      } else if (p === 1) {
        if (b.fireT <= 0) {
          this.fireFan(b.x - 28, b.y + 8, 2, 0.28, 1.55, ang, '#d8e4ff', 5, 'knife');
          this.fireFan(b.x + 28, b.y + 8, 2, 0.28, 1.55, ang, '#ff8a6a', 5, 'knife');
          b.fireT = 28;
        }
      } else {
        if (b.fireT <= 0) {
          for (let i = 0; i < 3; i++) {
            const a0 = rand(0, TAU), sp = rand(0.95, 1.7);
            this.spawnBullet(b.x, b.y, Math.cos(a0) * sp, Math.sin(a0) * sp, '#ff5a5a', 6.4, 'square');
          }
          this.fireAimed(b.x, b.y, 1.85, '#fff4c2', 5.2, 'orb');
          b.fireT = 20;
        }
      }
    } else {
      if (p === 0) {
        if (b.fireT <= 0) { this.fireRing(b.x, b.y, 7, 0.78, '#ffd76a', 8.5, b.t * 0.01, 'orb'); b.fireT = 56; }
      } else if (p === 1) {
        b.patternT = (b.patternT || 0) + 0.08;
        if (b.fireT <= 0) { this.fireSpiral(b.x, b.y, b.patternT, 2, 1.35, '#ff8c42', 5.6, 'knife'); b.fireT = 16; }
      } else {
        if (b.fireT <= 0) {
          this.fireRing(b.x, b.y, 6, 0.75, '#ff6a3a', 11, b.t * 0.04, 'orb');
          this.fireAimed(b.x, b.y, 2.0, '#fff', 7, 'square');
          b.fireT = 26;
        }
      }
    }
  }

  updateBoss() {
    const b = this.g.boss;
    if (!b) return;
    b.t++;
    if (b.defeated) {
      b.deathT++;
      if (b.deathT > 120) {
        this.g.bossActive = false;
        this.g.bossesDefeated++;
        this.g.boss = null;
        if (this.g.bossesDefeated < 3) { this.g.act++; this.g.waveCount = 0; this.g.spawnTimer = 40; }
      }
      return;
    }
    b.fireT--;
    if (b.phaseFlash > 0) b.phaseFlash--;
    const hpRatio = b.hp / b.maxhp;
    const newPhase = hpRatio > 0.66 ? 0 : hpRatio > 0.33 ? 1 : 2;
    if (newPhase !== b.phase) {
      b.phase = newPhase;
      b.phaseFlash = 42;
      b.fireT = 36;
      this.spark(b.x, b.y, b.phase === 2 ? '#ff6a8a' : '#c08bff', 32);
      this.g.floaters.push({ x: W / 2, y: H * 0.34, text: PHASE_NAMES[b.act][b.phase], life: 78, max: 78, color: '#fff', big: true, vy: -0.15 });
    }
    b.x += Math.sin(b.t * 0.025) * 1.2;
    b.x = clamp(b.x, 80, W - 80);
    this.updateBossFire(b);
    for (const s of this.g.pShots) {
      const dmg = this.applyShot(s, b, b.x, b.y, b.r);
      if (dmg) {
        b.hp -= dmg;
        this.spark(b.x, b.y, '#fff', 3);
        if (b.hp <= 0 && !b.defeated) { b.defeated = true; b.deathT = 0; this.addScore(2000, b.x, b.y, '#ffd76a', true); }
      }
    }
  }

  updateEnemy(e) {
    e.t++;
    e.fireT--;
    if (e.type === 'fairy') {
      e.x += e.vx; e.y += e.vy;
      if (e.y > H + 20 || e.x < -20 || e.x > W + 20) e.dead = true;
    } else {
      if (e.y < 140) e.y += e.vy;
      else e.x += Math.sin(e.t * 0.03) * 0.9;
    }
    if (e.y > 0 && e.y < H - 80) {
      const tgt = this.nearestPlayer(e.x, e.y);
      if (e.type === 'fairy' && e.fireT <= 0) {
        this.fireAimed(e.x, e.y, 1.45, '#ff7ec8', 4.5, 'rice');
        e.fireT = rand(100, 160);
      }
      if (e.type === 'shooter' && e.fireT <= 0) {
        this.fireFan(e.x, e.y, 3, 0.9, 1.25, Math.atan2(tgt.y - e.y, tgt.x - e.x), '#7ed0ff', 4.2, 'pellet');
        e.fireT = rand(85, 135);
      }
      if (e.type === 'spiral') {
        e.spiral += 0.12;
        if (e.fireT <= 0) { this.fireSpiral(e.x, e.y, e.spiral, 2, 1.25, '#c08bff', 4.8, 'star'); e.fireT = 20; }
      }
    }
    for (const s of this.g.pShots) {
      const dmg = this.applyShot(s, e, e.x, e.y, e.r);
      if (dmg) {
        e.hp -= dmg;
        this.spark(e.x, e.y, '#fff', 4);
        if (e.hp <= 0 && !e.dead) this.killEnemy(e);
      }
    }
  }

  useBomb(p) {
    if (p.bombs <= 0 || this.g.spellAnim) return;
    p.bombs--;
    this.g.bombGauge = 0;
    p.inv = Math.max(p.inv, 420);
    this.g.shake = 16;
    this.g.spellAnim = { t: 0, owner: p.id };
    this.g.pBullets = [];
    for (const e of this.g.enemies) { e.hp -= 36; if (e.hp <= 0) this.killEnemy(e); }
    if (this.g.boss && !this.g.boss.defeated) {
      this.g.boss.hp -= 140;
      if (this.g.boss.hp <= 0) { this.g.boss.defeated = true; this.g.boss.deathT = 0; }
    }
    this.spark(p.x, p.y, '#ffe57a', 24);
  }

  hitPlayer(p) {
    p.lives--;
    this.g.shake = 14;
    this.g.pBullets = this.g.pBullets.filter(b => dist2(b.x, b.y, p.x, p.y) > 80 * 80);
    this.spark(p.x, p.y, '#ff6060', 24);
    if (p.lives <= 0) {
      p.dead = true;
    } else {
      p.inv = 150;
      p.x = W / 2 + (p.id === 0 ? -36 : 36);
      p.y = H - 110;
    }
    if (this.alivePlayers().length === 0) {
      this.g.state = 'over';
      this.g.win = false;
    }
  }

  updatePlayer(p, input) {
    if (p.dead || p.lives <= 0) return;
    const sp = input.boost ? p.boostSpeed : p.speed;
    let dx = 0, dy = 0;
    if (input.left) dx -= 1;
    if (input.right) dx += 1;
    if (input.up) dy -= 1;
    if (input.down) dy += 1;
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
    p.x = clamp(p.x + dx * sp, 20, W - 20);
    p.y = clamp(p.y + dy * sp, 22, H - 22);

    if (input.weapon) {
      input.weapon = false;
      p.weapon = (p.weapon + 1) % WEAPONS.length;
      this.spark(p.x, p.y, '#9cff6a', 10);
    }
    this.playerShoot(p);
    if (input.bomb) {
      input.bomb = false;
      this.useBomb(p);
    }
    if (p.inv > 0) p.inv--;

    for (const b of this.g.pBullets) {
      const d2 = dist2(b.x, b.y, p.x, p.y);
      if (d2 < (b.r + p.r) ** 2) {
        if (p.inv <= 0) { this.hitPlayer(p); return; }
      } else if (d2 < (b.r + p.grazeR) ** 2) {
        if (!b.grazed) {
          b.grazed = true;
          this.g.graze++;
          this.g.score += 30;
          this.g.bombGauge = Math.min(100, this.g.bombGauge + 0.6);
          this.spark(b.x, b.y, '#fff', 2);
        }
      }
    }
  }

  updateSpellFX() {
    const sa = this.g.spellAnim;
    if (!sa) return true;
    sa.t++;
    if (sa.t >= 160) { this.g.spellAnim = null; return true; }
    return false;
  }

  tick() {
    if (this.g.state !== 'playing') return;
    this.g.time++;

    if (this.g.spellAnim) {
      this.updateSpellFX();
      this.stepParticles();
      if (this.g.shake > 0) this.g.shake *= 0.85;
      return;
    }

    this.g.stars.forEach(s => { s.y += s.s * 0.016; if (s.y > H) { s.y = 0; s.x = rand(0, W); } });
    this.g.score += 1;
    if (this.g.bombGauge < 100) this.g.bombGauge = Math.min(100, this.g.bombGauge + 0.05);

    this.updatePlayer(this.g.players[0], this.inputs[0]);
    this.updatePlayer(this.g.players[1], this.inputs[1]);

    if (this.g.state !== 'playing') return;

    if (!this.g.bossActive && this.g.bossesDefeated < 3) {
      const A = ACTS[this.g.act];
      if (this.g.waveCount < A.waves) {
        this.g.spawnTimer--;
        if (this.g.spawnTimer <= 0) {
          const t = A.types[randi(0, A.types.length - 1)];
          this.g.enemies.push(this.makeEnemy(t, rand(50, W - 50), -20));
          this.g.waveCount++;
          this.g.spawnTimer = rand(A.spawnMin, A.spawnMax);
        }
      } else if (this.g.enemies.length === 0) {
        this.spawnBoss(this.g.act);
      }
    }

    this.g.enemies.forEach(e => this.updateEnemy(e));
    this.g.enemies = this.g.enemies.filter(e => !e.dead);
    if (this.g.boss) this.updateBoss();

    for (const s of this.g.pShots) {
      s.x += s.vx; s.y += s.vy;
      if (s.y < -20 || s.x < -20 || s.x > W + 20 || s.y > H + 20) s.dead = true;
    }
    this.g.pShots = this.g.pShots.filter(s => !s.dead);

    for (const b of this.g.pBullets) {
      b.x += b.vx; b.y += b.vy; b.spin = (b.spin || 0) + 0.08;
      if (b.y > H + 30 || b.y < -40 || b.x < -40 || b.x > W + 40) b.dead = true;
    }
    this.g.pBullets = this.g.pBullets.filter(b => !b.dead);

    this.stepParticles();
    this.g.floaters.forEach(f => { f.y += f.vy; f.life--; });
    this.g.floaters = this.g.floaters.filter(f => f.life > 0);

    if (this.g.shake > 0) this.g.shake *= 0.85;

    if (this.g.bossesDefeated >= 3 && !this.g.boss && this.g.enemies.length === 0 && this.g.pBullets.length < 5) {
      this.g.state = 'over';
      this.g.win = true;
    }
  }

  stepParticles() {
    for (const p of this.g.particles) {
      if (p.ring) { p.t++; p.r = (p.t / p.life) * p.max; if (p.t >= p.life) p.dead = true; }
      else { p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life--; if (p.life <= 0) p.dead = true; }
    }
    this.g.particles = this.g.particles.filter(p => !p.dead);
  }

  exportSnapshot() {
    const g = this.g;
    let bullets = g.pBullets;
    if (bullets.length > 100) {
      bullets = bullets.filter((_, i) => i % Math.ceil(bullets.length / 100) === 0);
    }
    return {
      type: 'state',
      frame: g.time,
      state: g.state,
      win: g.win,
      score: g.score,
      graze: g.graze,
      bombGauge: g.bombGauge,
      act: g.act,
      waveCount: g.waveCount,
      bossesDefeated: g.bossesDefeated,
      bossActive: g.bossActive,
      shake: g.shake,
      spellAnim: g.spellAnim ? { t: g.spellAnim.t, owner: g.spellAnim.owner } : null,
      players: g.players.map(p => ({
        id: p.id, x: p.x, y: p.y, weapon: p.weapon, inv: p.inv,
        lives: p.lives, bombs: p.bombs, dead: p.dead, tint: p.tint, accent: p.accent,
      })),
      bullets: bullets.map(b => [Math.round(b.x), Math.round(b.y), +b.vx.toFixed(2), +b.vy.toFixed(2), b.r, b.color, b.type || 'pellet', +(b.spin || 0).toFixed(2)]),
      shots: g.pShots.slice(0, 80).map(s => [Math.round(s.x), Math.round(s.y), s.r, s.kind || 'pellet', s.owner ?? 0]),
      enemies: g.enemies.map(e => [e.id, Math.round(e.x), Math.round(e.y), e.type, e.hp, Math.round(e.hue)]),
      boss: g.boss ? {
        x: Math.round(g.boss.x), y: Math.round(g.boss.y), hp: g.boss.hp, maxhp: g.boss.maxhp,
        phase: g.boss.phase, act: g.boss.act, defeated: g.boss.defeated, name: g.boss.name,
        phaseFlash: g.boss.phaseFlash, t: g.boss.t,
      } : null,
      floaters: g.floaters.slice(-8).map(f => [Math.round(f.x), Math.round(f.y), f.text, f.life, f.big ? 1 : 0]),
    };
  }

  static applySnapshot(g, snap) {
    g.state = snap.state;
    g.win = snap.win;
    g.score = snap.score;
    g.graze = snap.graze;
    g.bombGauge = snap.bombGauge;
    g.act = snap.act;
    g.waveCount = snap.waveCount;
    g.bossesDefeated = snap.bossesDefeated;
    g.bossActive = snap.bossActive;
    g.shake = snap.shake;
    g.spellAnim = snap.spellAnim;
    g.players = snap.players;
    g.pBullets = snap.bullets.map(([x, y, vx, vy, r, color, type, spin]) => ({ x, y, vx, vy, r, color, type, spin }));
    g.pShots = snap.shots.map(([x, y, r, kind, owner]) => ({ x, y, r, kind, owner, dead: false }));
    g.enemies = snap.enemies.map(([id, x, y, type, hp, hue]) => ({ id, x, y, type, hp, hue, r: 14, dead: false }));
    g.boss = snap.boss;
    g.floaters = snap.floaters.map(([x, y, text, life, big]) => ({ x, y, text, life, max: life, color: '#ffe57a', big: !!big, vy: -0.8 }));
    g.time = snap.frame;
  }
}

COOP.GameEngine = GameEngine;

const { W, H, TAU, WEAPONS } = COOP.util;

function drawGame(ctx, g, { localPlayerId = 0, showHit = true } = {}) {
  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a0820');
  bg.addColorStop(1, '#05030f');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const mg = ctx.createRadialGradient(W * 0.72, 120, 10, W * 0.72, 120, 90);
  mg.addColorStop(0, 'rgba(255,245,210,.95)');
  mg.addColorStop(0.7, 'rgba(230,220,180,.5)');
  mg.addColorStop(1, 'rgba(230,220,180,0)');
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.arc(W * 0.72, 120, 90, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,248,225,.9)';
  ctx.beginPath();
  ctx.arc(W * 0.72, 120, 46, 0, TAU);
  ctx.fill();

  (g.stars || []).forEach(s => {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#cfd6ff';
    ctx.fillRect(s.x, s.y, s.r, s.r);
  });
  ctx.globalAlpha = 1;

  ctx.save();
  if (g.shake > 0.5) {
    ctx.translate((Math.random() - 0.5) * g.shake, (Math.random() - 0.5) * g.shake);
  }

  (g.enemies || []).forEach(e => {
    const c = 'hsl(' + e.hue + ',80%,62%)';
    ctx.fillStyle = c;
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 5, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, TAU);
    ctx.fill();
  });

  if (g.boss) drawBoss(ctx, g.boss);

  (g.players || []).forEach(p => {
    if (!p.dead && p.lives > 0) drawPlayer(ctx, p, p.id === localPlayerId);
  });

  (g.pBullets || []).forEach(b => drawBullet(ctx, b));
  (g.pShots || []).forEach(s => drawShot(ctx, s));

  (g.particles || []).forEach(p => {
    if (p.ring) {
      const a = 1 - p.t / p.life;
      ctx.strokeStyle = 'rgba(255,200,240,' + a + ')';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.stroke();
    } else {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  });

  (g.floaters || []).forEach(f => {
    ctx.globalAlpha = Math.max(0, f.life / (f.max || f.life));
    ctx.fillStyle = f.color || '#ffe57a';
    ctx.textAlign = 'center';
    ctx.font = (f.big ? 'bold 36px' : 'bold 16px') + ' sans-serif';
    ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  });

  if (showHit && g.players) {
    g.players.forEach(p => {
      if (!p.dead && p.lives > 0) drawHitPoint(ctx, p);
    });
  }

  ctx.restore();
  drawHUD(ctx, g, localPlayerId);

  if (g.spellAnim) {
    ctx.fillStyle = 'rgba(255,120,200,0.15)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('召唤蛋神', W / 2, H * 0.38);
  }
}

function drawPlayer(ctx, p, isLocal) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.globalAlpha = p.inv > 0 && (p.inv % 8 < 4) ? 0.45 : 1;

  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 28);
  g.addColorStop(0, p.tint + 'cc');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, 28, 0, TAU);
  ctx.fill();

  ctx.fillStyle = p.tint;
  ctx.beginPath();
  ctx.moveTo(-10, 0);
  ctx.lineTo(-28, 10);
  ctx.lineTo(-11, 12);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(10, 0);
  ctx.lineTo(28, 10);
  ctx.lineTo(11, 12);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(0, -16);
  ctx.quadraticCurveTo(16, -5, 12, 16);
  ctx.lineTo(-12, 16);
  ctx.quadraticCurveTo(-16, -5, 0, -16);
  ctx.fill();
  ctx.fillStyle = p.accent;
  ctx.beginPath();
  ctx.moveTo(0, -16);
  ctx.lineTo(12, 16);
  ctx.lineTo(-12, 16);
  ctx.closePath();
  ctx.fill();

  if (isLocal) {
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, 32, 0, TAU);
    ctx.stroke();
  }

  ctx.fillStyle = '#fff';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('P' + (p.id + 1), 0, 28);
  ctx.restore();
}

function drawHitPoint(ctx, p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, 3.3, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = p.id === 0 ? '#ff2a4a' : '#ffd76a';
  ctx.lineWidth = 1.8;
  ctx.stroke();
  ctx.restore();
}

function drawBullet(ctx, b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.fillStyle = b.color || '#ff7ec8';
  ctx.beginPath();
  ctx.arc(0, 0, b.r, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawShot(ctx, s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.fillStyle = s.owner === 1 ? '#9cff6a' : '#ffe08a';
  ctx.beginPath();
  ctx.arc(0, 0, s.r, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawBoss(ctx, b) {
  const colors = ['#5ad1ff', '#c77bff', '#ff4d6d'];
  const c = colors[b.act] || '#fff';
  const sz = [95, 110, 100][b.act] || 90;

  ctx.save();
  ctx.translate(b.x, b.y);
  if (b.phaseFlash > 0) {
    ctx.globalAlpha = 0.35 + 0.25 * Math.sin(b.t * 0.4);
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(0, 0, sz + 20, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, sz);
  glow.addColorStop(0, c + 'aa');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, 0, sz, 0, TAU);
  ctx.fill();

  ctx.strokeStyle = c;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, sz * 0.55, 0, TAU);
  ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(b.name || 'BOSS', 0, -sz * 0.2);
  ctx.font = '12px sans-serif';
  ctx.fillText('HP ' + Math.ceil(b.hp), 0, sz * 0.15);

  ctx.restore();

  const bw = W - 80, bh = 12, bx = 40, by = 32;
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  ctx.fillRect(bx, by, bw, bh);
  const r = Math.max(0, Math.min(1, b.hp / b.maxhp));
  ctx.fillStyle = c;
  ctx.fillRect(bx, by, bw * r, bh);
  ctx.strokeStyle = 'rgba(255,255,255,.6)';
  ctx.strokeRect(bx, by, bw, bh);
}

function drawHUD(ctx, g, localPlayerId) {
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(0, 0, W, 28);
  ctx.fillStyle = '#ffe57a';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + (g.score || 0), 12, 21);
  ctx.fillStyle = '#bfe6ff';
  ctx.textAlign = 'right';
  ctx.fillText('擦弹 ' + (g.graze || 0), W - 10, 21);

  const p = (g.players || []).find(pl => pl.id === localPlayerId) || g.players?.[0];
  if (p) {
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ff6a8a';
    ctx.font = '12px sans-serif';
    ctx.fillText('P' + (p.id + 1) + ' 残机 ' + p.lives + '  符卡 ' + p.bombs, 12, 46);
    ctx.fillStyle = '#9cff6a';
    ctx.fillText('武器 ' + WEAPONS[p.weapon], 12, 62);
  }

  ctx.fillStyle = 'rgba(255,255,255,.15)';
  ctx.fillRect(48, 72, 88, 5);
  ctx.fillStyle = '#ffd76a';
  ctx.fillRect(48, 72, 88 * ((g.bombGauge || 0) / 100), 5);
}

COOP.drawGame = drawGame;

/**
 * 输入：主机 P1 用方向键/WASD，访客 P2 用 IJKL 或触屏
 */
class InputManager {
  constructor(playerId, role) {
    this.playerId = playerId;
    this.role = role;
    this.keys = {};
    this.pending = { left: false, right: false, up: false, down: false, boost: false, bomb: false, weapon: false };
    this.touchDrag = null;
    this.bindKeyboard();
    this.bindTouch();
  }

  bindKeyboard() {
    const map = this.playerId === 0
      ? {
          ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
          a: 'left', d: 'right', w: 'up', s: 'down',
          Shift: 'boost', e: 'bomb', q: 'weapon',
        }
      : {
          j: 'left', l: 'right', i: 'up', k: 'down',
          u: 'boost', o: 'bomb', p: 'weapon',
        };

    addEventListener('keydown', e => {
      const k = map[e.key];
      if (!k) return;
      if (k === 'weapon' || k === 'bomb') {
        if (!e.repeat) this.pending[k] = true;
      } else {
        this.keys[k] = true;
      }
      e.preventDefault();
    });
    addEventListener('keyup', e => {
      const k = map[e.key];
      if (k && k !== 'weapon' && k !== 'bomb') this.keys[k] = false;
    });
  }

  bindTouch() {
    const cv = document.getElementById('game');
    if (!cv) return;
    cv.addEventListener('touchstart', e => {
      if (this.role === 'guest' || this.playerId === 1) {
        const t = e.touches[0];
        this.touchDrag = { sx: t.clientX, sy: t.clientY, px: 0, py: 0, ox: 0, oy: 0 };
        e.preventDefault();
      }
    }, { passive: false });
    cv.addEventListener('touchmove', e => {
      if (!this.touchDrag) return;
      const t = e.touches[0];
      const rect = cv.getBoundingClientRect();
      const scaleX = cv.width / rect.width;
      const scaleY = cv.height / rect.height;
      this.touchDrag.ox = (t.clientX - this.touchDrag.sx) * scaleX;
      this.touchDrag.oy = (t.clientY - this.touchDrag.sy) * scaleY;
      e.preventDefault();
    }, { passive: false });
    cv.addEventListener('touchend', () => { this.touchDrag = null; });
  }

  /** @returns {{left:boolean,right:boolean,up:boolean,down:boolean,boost:boolean,bomb:boolean,weapon:boolean, touchDx?:number, touchDy?:number}} */
  snapshot() {
    const out = {
      left: !!this.keys.left,
      right: !!this.keys.right,
      up: !!this.keys.up,
      down: !!this.keys.down,
      boost: !!this.keys.boost,
      bomb: !!this.pending.bomb,
      weapon: !!this.pending.weapon,
    };
    this.pending.bomb = false;
    this.pending.weapon = false;

    if (this.touchDrag) {
      out.touchDx = this.touchDrag.ox;
      out.touchDy = this.touchDrag.oy;
    }
    return out;
  }

  /** 主机合并触屏相对移动 */
  applyTouchToPlayer(p, input, W, H) {
    if (input.touchDx == null) return;
    const sp = input.boost ? 7.2 : 4.2;
    p.x = Math.max(20, Math.min(W - 20, p.x + input.touchDx * 0.08));
    p.y = Math.max(22, Math.min(H - 22, p.y + input.touchDy * 0.08));
  }
}

COOP.InputManager = InputManager;

/**
 * 纯浏览器 WebRTC 点对点 — 仅需 GitHub Pages，无需自建服务器
 * 连接方式：主机生成邀请码 → 微信发给队友 → 队友生成应答码 → 发回主机粘贴
 */
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun.ekiga.net' },
];

function waitIceComplete(pc) {
  if (pc.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise(resolve => {
    const check = () => {
      if (pc.iceGatheringState === 'complete') {
        pc.removeEventListener('icegatheringstatechange', check);
        resolve();
      }
    };
    pc.addEventListener('icegatheringstatechange', check);
    setTimeout(resolve, 4000);
  });
}

function packDesc(desc) {
  return btoa(unescape(encodeURIComponent(JSON.stringify(desc))));
}

function unpackDesc(str) {
  const s = str.trim().replace(/\s+/g, '');
  return JSON.parse(decodeURIComponent(escape(atob(s))));
}

class P2PLink {
  constructor(isHost) {
    this.isHost = isHost;
    this.pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    this.dc = null;
    this.handlers = {};
    this.open = false;

    this.pc.onconnectionstatechange = () => {
      if (this.pc.connectionState === 'connected') this.handlers.connected?.();
      if (['failed', 'disconnected', 'closed'].includes(this.pc.connectionState)) {
        this.handlers.close?.();
      }
    };

    if (isHost) {
      this.dc = this.pc.createDataChannel('game', { ordered: false, maxRetransmits: 0 });
      this._bindChannel(this.dc);
    } else {
      this.pc.ondatachannel = ev => {
        this.dc = ev.channel;
        this._bindChannel(this.dc);
      };
    }
  }

  on(type, fn) { this.handlers[type] = fn; }

  _bindChannel(dc) {
    dc.binaryType = 'arraybuffer';
    dc.onopen = () => { this.open = true; this.handlers.open?.(); };
    dc.onclose = () => { this.open = false; this.handlers.close?.(); };
    dc.onmessage = ev => {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'state') this.handlers.state?.(msg);
        else this.handlers[msg.type]?.(msg);
      } catch (_) {}
    };
  }

  send(obj) {
    if (this.dc?.readyState === 'open') {
      this.dc.send(JSON.stringify(obj));
    }
  }

  sendState(state) { this.send(state); }
  sendInput(input) { this.send({ type: 'input', input }); }
  sendStart() { this.send({ type: 'start' }); }

  /** 主机：生成邀请码 */
  async createInvite() {
    const offer = await this.pc.createOffer();
    await this.pc.setLocalDescription(offer);
    await waitIceComplete(this.pc);
    return packDesc(this.pc.localDescription);
  }

  /** 队友：粘贴邀请码，生成应答码 */
  async acceptInvite(inviteCode) {
    await this.pc.setRemoteDescription(unpackDesc(inviteCode));
    const answer = await this.pc.createAnswer();
    await this.pc.setLocalDescription(answer);
    await waitIceComplete(this.pc);
    return packDesc(this.pc.localDescription);
  }

  /** 主机：粘贴应答码，完成连接 */
  async completeInvite(answerCode) {
    await this.pc.setRemoteDescription(unpackDesc(answerCode));
  }

  close() {
    this.dc?.close();
    this.pc.close();
  }
}

COOP.P2PLink = P2PLink;

(function () {
  const { W, H, createGameState, rand } = COOP.util;
  const GameEngine = COOP.GameEngine;
  const drawGame = COOP.drawGame;
  const InputManager = COOP.InputManager;
  const P2PLink = COOP.P2PLink;

  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');

  const lobby = document.getElementById('lobby');
  const hud = document.getElementById('hud');
  const statusEl = document.getElementById('status');
  const hostPanel = document.getElementById('hostPanel');
  const guestPanel = document.getElementById('guestPanel');
  const inviteOut = document.getElementById('inviteOut');
  const inviteIn = document.getElementById('inviteIn');
  const answerOut = document.getElementById('answerOut');
  const answerIn = document.getElementById('answerIn');
  const fileBanner = document.getElementById('fileBanner');

  let role = null;
  let link = null;
  let engine = null;
  let guestState = null;
  let guestStars = null;
  let running = false;
  let input = null;
  let lastInputSent = 0;
  const INPUT_RATE = 50;

  const isFile = location.protocol === 'file:';
  const canWebRTC = !!(window.RTCPeerConnection && window.isSecureContext);

  if (isFile) {
    fileBanner.classList.remove('hidden');
  }

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function showLobby(show) {
    lobby.classList.toggle('hidden', !show);
    hud.classList.toggle('hidden', show);
  }

  function showPanel(mode) {
    hostPanel.classList.toggle('hidden', mode !== 'host');
    guestPanel.classList.toggle('hidden', mode !== 'guest');
    document.getElementById('rolePick').classList.toggle('hidden', mode !== null);
  }

  function requireWebRTC() {
    if (!canWebRTC) {
      setStatus('联机需要 http://localhost 或 https 打开，不能直接双击 html 文件', 'warn');
      return false;
    }
    return true;
  }

  function initGuestStars() {
    guestStars = [];
    for (let i = 0; i < 120; i++) {
      guestStars.push({ x: rand(0, W), y: rand(0, H), r: rand(0.4, 1.6), s: rand(8, 26), a: rand(0.3, 1) });
    }
  }

  function setupLinkHandlers() {
    link.on('open', () => {
      setStatus('已直连队友！', 'ok');
      if (role === 'host') {
        document.getElementById('btnStart').classList.remove('hidden');
        setStatus('连接成功，点击「开始游戏」', 'ok');
      } else {
        setStatus('连接成功，等待主机开始…', 'ok');
      }
    });

    link.on('close', () => {
      setStatus('连接已断开', 'warn');
      stopGame();
    });

    link.on('start', () => beginGame());

    link.on('state', snap => {
      if (role !== 'guest') return;
      if (!guestState) {
        guestState = createGameState();
        guestState.stars = guestStars;
      }
      GameEngine.applySnapshot(guestState, snap);
      guestState.stars.forEach(s => {
        s.y += s.s * 0.016;
        if (s.y > H) { s.y = 0; s.x = rand(0, W); }
      });
    });

    link.on('input', msg => {
      if (role !== 'host' || !engine) return;
      const inp = msg.input || {};
      engine.setInput(1, {
        left: !!inp.left, right: !!inp.right, up: !!inp.up, down: !!inp.down,
        boost: !!inp.boost, bomb: !!inp.bomb, weapon: !!inp.weapon,
      });
      if (inp.touchDx != null) {
        const p = engine.g.players[1];
        p.x = Math.max(20, Math.min(W - 20, p.x + inp.touchDx * 0.08));
        p.y = Math.max(22, Math.min(H - 22, p.y + inp.touchDy * 0.08));
      }
    });
  }

  function beginGame() {
    showLobby(false);
    running = true;
    if (role === 'host') {
      engine = new GameEngine();
      engine.reset();
      input = new InputManager(0, 'host');
    } else {
      initGuestStars();
      guestState = createGameState();
      guestState.stars = guestStars;
      input = new InputManager(1, 'guest');
    }
    loop();
  }

  function stopGame() {
    running = false;
    engine = null;
    guestState = null;
  }

  function loop() {
    if (!running) return;

    if (role === 'host' && engine) {
      engine.setInput(0, input.snapshot());
      engine.tick();
      drawGame(ctx, engine.g, { localPlayerId: 0 });
      if (engine.g.time % 3 === 0) link.sendState(engine.exportSnapshot());
      if (engine.g.state === 'over') {
        running = false;
        setTimeout(() => showGameOver(engine.g.win, engine.g.score), 500);
        return;
      }
    } else if (role === 'guest' && guestState) {
      const now = performance.now();
      if (now - lastInputSent > INPUT_RATE) {
        link.sendInput(input.snapshot());
        lastInputSent = now;
      }
      drawGame(ctx, guestState, { localPlayerId: 1 });
      if (guestState.state === 'over') {
        running = false;
        setTimeout(() => showGameOver(guestState.win, guestState.score), 500);
        return;
      }
    }
    requestAnimationFrame(loop);
  }

  function showGameOver(win, score) {
    showLobby(true);
    setStatus((win ? '通关！' : '游戏结束，') + '得分 ' + score, win ? 'ok' : 'warn');
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      setStatus('已复制到剪贴板', 'ok');
    } catch {
      setStatus('请手动全选复制', 'warn');
    }
  }

  document.getElementById('btnPickHost').onclick = () => {
    if (!requireWebRTC()) return;
    role = 'host';
    link = new P2PLink(true);
    setupLinkHandlers();
    showPanel('host');
    setStatus('点击「生成邀请码」后发给队友');
  };

  document.getElementById('btnPickGuest').onclick = () => {
    if (!requireWebRTC()) return;
    role = 'guest';
    link = new P2PLink(false);
    setupLinkHandlers();
    showPanel('guest');
    setStatus('粘贴队友的邀请码');
  };

  document.getElementById('btnGenInvite').onclick = async () => {
    if (!requireWebRTC()) return;
    try {
      setStatus('生成中…');
      inviteOut.value = await link.createInvite();
      setStatus('邀请码已生成，复制发给队友（微信/QQ）', 'ok');
    } catch (e) {
      setStatus('生成失败：' + e.message, 'warn');
    }
  };

  document.getElementById('btnCopyInvite').onclick = () => copyText(inviteOut.value);

  document.getElementById('btnGenAnswer').onclick = async () => {
    if (!requireWebRTC()) return;
    const code = inviteIn.value.trim();
    if (!code) { setStatus('请先粘贴邀请码', 'warn'); return; }
    try {
      setStatus('连接中…');
      answerOut.value = await link.acceptInvite(code);
      setStatus('应答码已生成，复制发回给主机', 'ok');
    } catch (e) {
      setStatus('连接失败：' + e.message, 'warn');
    }
  };

  document.getElementById('btnCopyAnswer').onclick = () => copyText(answerOut.value);

  document.getElementById('btnComplete').onclick = async () => {
    if (!requireWebRTC()) return;
    const code = answerIn.value.trim();
    if (!code) { setStatus('请粘贴队友的应答码', 'warn'); return; }
    try {
      setStatus('握手中…');
      await link.completeInvite(code);
    } catch (e) {
      setStatus('握手失败：' + e.message, 'warn');
    }
  };

  document.getElementById('btnStart').onclick = () => {
    link.sendStart();
    beginGame();
  };

  if ('ontouchstart' in window) {
    document.body.classList.add('touch');
    const bind = (id, fn) => {
      document.getElementById(id)?.addEventListener('touchstart', e => {
        e.preventDefault();
        if (running && input) fn();
      }, { passive: false });
    };
    bind('btnWeapon', () => { input.pending.weapon = true; });
    bind('btnBomb', () => { input.pending.bomb = true; });
  }

  if (canWebRTC) {
    setStatus('选择「创建房间」或「加入房间」');
  } else if (isFile) {
    setStatus('请双击运行「本地启动.bat」，用 localhost 打开', 'warn');
  } else {
    setStatus('当前环境不支持 WebRTC 联机', 'warn');
  }
  showPanel(null);
})();

</script>
