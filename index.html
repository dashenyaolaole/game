<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>群友打飞机</title>
<style>
  :root{ --bg:#070612; --panel:#12102a; --accent:#ff7ec8; --accent2:#7ed0ff; --gold:#ffd76a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:#e9e6ff;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif; overflow:hidden; }
  #stage{ position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  canvas{ background:#05030f; box-shadow:0 0 60px rgba(120,80,200,.35); border-radius:6px; touch-action:none; }
  .overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(5,3,15,.82); text-align:center; padding:24px; backdrop-filter:blur(3px); z-index:5; }
  .overlay h1{ font-size:34px; margin:0 0 6px; letter-spacing:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .overlay h2{ font-size:20px; color:var(--gold); margin:0 0 14px; letter-spacing:2px; }
  .overlay p{ color:#b9b3e6; font-size:14px; line-height:1.9; max-width:460px; margin:4px 0; }
  .key{ display:inline-block; min-width:22px; padding:1px 7px; margin:0 2px; border:1px solid #5a4f8a; border-radius:5px;
    background:#1b1638; color:#fff; font-size:12px; }
  .btn{ margin-top:18px; padding:12px 34px; font-size:17px; font-weight:700; letter-spacing:2px; cursor:pointer;
    border:none; border-radius:30px; color:#1a0a1f; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  .btn:hover{ filter:brightness(1.1); }
  .hidden{ display:none !important; }
  #hint{ position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-size:12px; color:#7a73a8; z-index:4; }

  /* canvas 等比适配屏幕（桌面/手机通用） */
  @supports (height:100dvh){ html,body{ height:100dvh; } }
  canvas{ max-width:100vw; max-height:100dvh; width:auto; height:auto; aspect-ratio:480/720; }

  /* 触屏控制（仅触屏设备显示） */
  #touchUI{ position:absolute; inset:0; z-index:7; display:none; pointer-events:none; }
  body.touch #touchUI{ display:block; }
  .tbtn{ position:absolute; pointer-events:auto; right:18px; width:74px; height:74px; border-radius:50%;
    border:2px solid rgba(255,255,255,.6); background:rgba(30,20,60,.5); color:#fff; font-size:13px; font-weight:700;
    line-height:1.15; text-align:center; -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); user-select:none; }
  .tbtn:active{ background:rgba(120,80,200,.75); transform:scale(.94); }
  #btnWeapon{ bottom:100px; }
  #btnBomb{ bottom:18px; border-color:rgba(255,150,200,.85); background:rgba(120,30,80,.5); }
  body.touch #hint{ font-size:11px; bottom:6px; }

  /* 符卡演出（DOM 层，GIF 动图直接播放） */
  #spellOverlay{ position:absolute; inset:0; z-index:6; display:none; visibility:hidden; align-items:center; justify-content:center;
    opacity:0; transition:opacity .35s; pointer-events:none; background:rgba(5,3,15,.25); }
  #spellOverlay.show{ display:flex; opacity:1; visibility:visible; }
  #spellOverlay.fadeout{ opacity:0; }
  #spellName{ position:absolute; top:26%; font-size:54px; font-weight:bold; letter-spacing:6px;
    color:#ff7ec8; text-shadow:0 0 10px #fff, 0 0 26px #ff7ec8; opacity:0; }
  #spellGif{ max-height:68%; max-width:86%; border:3px solid rgba(255,255,255,.55); border-radius:8px;
    box-shadow:0 0 40px rgba(255,255,255,.75); opacity:0; transform:scale(.3); }
  #spellOverlay.show #spellName{ animation:spellNameIn .8s ease-out forwards; }
  #spellOverlay.show #spellGif{ animation:spellGifIn .3s ease-out .5s forwards; }
  @keyframes spellNameIn{ 0%{ transform:translateX(-130%); opacity:0; } 25%{ transform:translateX(0); opacity:1; } 60%{ transform:translateX(0); opacity:1; } 100%{ transform:translateX(130%); opacity:0; } }
  @keyframes spellGifIn{ 0%{ transform:scale(.3); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="480" height="720"></canvas>

  <div id="startScreen" class="overlay">
    <h1>群友打飞机</h1>
    <h2>GROUP FIGHTER</h2>
    <p>群友集结，弹幕如雨。操纵战机穿越无尽的弹幕，击破夜之主宰。</p>
    <p>
      <span class="key">←→↑↓</span> / <span class="key">WASD</span> 移动<br>
      <span class="key">Q</span> 切换武器（散弹近战 / 速射集中 / 追踪导弹 / 光波贯穿）&nbsp;·&nbsp;
      <span class="key">E</span> 大招·清屏+无敌（初始 3 张）&nbsp;·&nbsp;
      <span class="key">Shift</span> 加速移动
    </p>
    <p style="color:#8de">自动射击，判定点极小。贴弹擦弹可加分；三幕流程，每幕清完小怪迎战一名 Boss，难度逐幕递增，共 3 位 Boss。</p>
    <button class="btn" id="startBtn">开始游戏</button>
  </div>

  <div id="overScreen" class="overlay hidden">
    <h1 id="overTitle">游戏结束</h1>
    <h2 id="overScore">SCORE 0</h2>
    <p id="overInfo"></p>
    <button class="btn" id="retryBtn">再战一局</button>
  </div>

  <div id="hint">提示：自动射击；Q 切换武器，E 放大招清屏；按住 Shift 加速；贴弹擦弹得分</div>

  <div id="spellOverlay">
    <div id="spellName"></div>
    <img id="spellGif" alt="">
  </div>

  <div id="touchUI">
    <button id="btnWeapon" class="tbtn">切换<br>武器</button>
    <button id="btnBomb" class="tbtn bomb">大招<br>清屏</button>
  </div>
</div>

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

// 符卡演出（动图用 DOM 层显示，GIF 才能播放）
let spellAnim = null; // {t}
const spellOverlay = document.getElementById('spellOverlay');
// ---------- 工具 ----------
const rand = (a,b)=> a + Math.random()*(b-a);
const randi = (a,b)=> Math.floor(rand(a,b+1));
const TAU = Math.PI*2;
const dist2 = (ax,ay,bx,by)=>{ const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; };
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);

// ---------- 输入 ----------
const keys = {};
const keyMap = {
  ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down',
  a:'left', d:'right', w:'up', s:'down',
  A:'left', D:'right', W:'up', S:'down',
  e:'bomb', E:'bomb',
  Shift:'boost'
};
addEventListener('keydown', e=>{
  if(keyMap[e.key]){ keys[keyMap[e.key]]=true; e.preventDefault(); }
  if((e.key==='q'||e.key==='Q') && !e.repeat && state==='playing'){
    player.weapon=(player.weapon+1)%WEAPONS.length;
    spark(player.x,player.y,'#9cff6a',10);
  }
});
addEventListener('keyup', e=>{ if(keyMap[e.key]) keys[keyMap[e.key]]=false; });

// ---------- 触屏支持（手机端） ----------
if('ontouchstart' in window || navigator.maxTouchPoints>0){
  document.body.classList.add('touch');
}
let drag=null;
cv.addEventListener('touchstart', e=>{
  if(state!=='playing') return;
  const t=e.touches[0];
  drag={ sx:t.clientX, sy:t.clientY, px:player.x, py:player.y };
  e.preventDefault();
}, {passive:false});
cv.addEventListener('touchmove', e=>{
  if(!drag) return;
  const t=e.touches[0];
  const r=cv.getBoundingClientRect();
  const k=W/r.width; // 屏幕坐标 → canvas 内部坐标
  player.x=clamp(drag.px+(t.clientX-drag.sx)*k, 12, W-12);
  player.y=clamp(drag.py+(t.clientY-drag.sy)*k, 12, H-12);
  e.preventDefault();
}, {passive:false});
cv.addEventListener('touchend', e=>{ if(e.touches.length===0) drag=null; });
cv.addEventListener('touchcancel', e=>{ if(e.touches.length===0) drag=null; });
function bindTouchBtn(id, fn){
  const el=document.getElementById(id);
  el.addEventListener('touchstart', e=>{ e.preventDefault(); e.stopPropagation(); if(state==='playing') fn(); }, {passive:false});
}
bindTouchBtn('btnWeapon', ()=>{ player.weapon=(player.weapon+1)%WEAPONS.length; spark(player.x,player.y,'#9cff6a',10); });
bindTouchBtn('btnBomb', ()=>{ if(!spellAnim) useBomb(); });

// ---------- 游戏状态 ----------
let state = 'start';   // start | playing | over
let score=0, graze=0, lives=3, bombs=3, bombGauge=0;
let time=0, spawnTimer=0, waveCount=0, bossActive=false, bossesDefeated=0, act=0;
let shake=0;

// ---------- 实体容器 ----------
let pBullets=[];   // 敌弹
let pShots=[];     // 自机弹
let enemies=[];
let particles=[];
let items=[];      // 掉落（得分/炸弹）
let stars=[];
let boss=null;
let floaters=[];  // 浮动得分提示（+N）

// 星空背景
for(let i=0;i<120;i++) stars.push({x:rand(0,W), y:rand(0,H), r:rand(.4,1.6), s:rand(8,26), a:rand(.3,1)});

// 子弹类型（按 Q 切换）
const WEAPONS = ['散弹','速射','追踪','光波'];
const WEAPON_HINT = ['贴脸爆发','集中点射','弱诱导','贯穿清列'];

// 三幕流程：每幕若干小怪波次后出一个 Boss，难度逐幕递增
const ACTS = [
  { waves:8,  spawnMin:55, spawnMax:95, types:['fairy','shooter'] },
  { waves:10, spawnMin:45, spawnMax:80, types:['fairy','shooter','spiral'] },
  { waves:12, spawnMin:38, spawnMax:70, types:['fairy','shooter','spiral'] },
];
const PHASE_NAMES = [
  ['星环咏唱','三重魔阵','星界崩裂'],
  ['铁拳试探','左右连击','暴怒乱拳'],
  ['山河镇守','拳风卷刃','镇山一击'],
];

// ---------- 玩家 ----------
const player = {
  x:W/2, y:H-110, r:2.6, grazeR:24,
  speed:4.2, boostSpeed:7.2, weapon:0,
  inv:0, fireCd:0,
  draw(part){
    ctx.save();
    ctx.translate(this.x, this.y);
    if(part!=='hit'){
      ctx.globalAlpha = (this.inv>0 && (this.inv%8<4)) ? .45 : 1;
      ctx.save(); ctx.globalAlpha *= .55;
      const g = ctx.createRadialGradient(0,0,0,0,0,28);
      g.addColorStop(0,'rgba(255,160,230,.9)'); g.addColorStop(1,'rgba(255,160,230,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,28,0,TAU); ctx.fill();
      ctx.restore();
      ctx.fillStyle='rgba(126,208,255,.7)';
      ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(-28,10); ctx.lineTo(-11,12); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(28,10); ctx.lineTo(11,12); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath();
      ctx.moveTo(0,-16); ctx.quadraticCurveTo(16,-5,12,16); ctx.lineTo(-12,16); ctx.quadraticCurveTo(-16,-5,0,-16); ctx.fill();
      ctx.fillStyle='#e23b6a'; ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(12,16); ctx.lineTo(-12,16); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#3a2a4a'; ctx.beginPath(); ctx.arc(0,-14,7,0,TAU); ctx.fill();
      ctx.strokeStyle='rgba(126,208,255,.85)'; ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.moveTo(-12,4); ctx.quadraticCurveTo(-28,12,-22,26); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(12,4); ctx.quadraticCurveTo(28,12,22,26); ctx.stroke();
      if(keys.boost){
        ctx.strokeStyle='rgba(126,208,255,.7)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(0,0,32,0,TAU); ctx.stroke();
      }
    }
    if(part!=='body'){
      ctx.globalAlpha=1;
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,3.3,0,TAU); ctx.fill();
      ctx.strokeStyle='#ff2a4a'; ctx.lineWidth=1.8; ctx.beginPath(); ctx.arc(0,0,3.3,0,TAU); ctx.stroke();
      ctx.fillStyle='#ff3a5a'; ctx.beginPath(); ctx.arc(0,0,1.4,0,TAU); ctx.fill();
    }
    ctx.restore();
  }
};

// ---------- 子弹 ----------
function spawnBullet(x,y,vx,vy,color,r=4, type='pellet'){
  pBullets.push({x,y,vx,vy,color,r,type, spin:rand(0,TAU)});
}
// 敌弹图样
function fireAimed(x,y,spd,color,r, type){
  const a = Math.atan2(player.y-y, player.x-x);
  spawnBullet(x,y,Math.cos(a)*spd,Math.sin(a)*spd,color,r,type);
}
function fireFan(x,y,n,spread,spd,baseA,color,r, type){
  for(let i=0;i<n;i++){
    const a = baseA - spread/2 + spread*(i/(n-1||1));
    spawnBullet(x,y,Math.cos(a)*spd,Math.sin(a)*spd,color,r,type);
  }
}
function fireRing(x,y,n,spd,color,r,offset=0, type){
  for(let i=0;i<n;i++){
    const a = offset + i/n*TAU;
    spawnBullet(x,y,Math.cos(a)*spd,Math.sin(a)*spd,color,r,type);
  }
}
function fireSpiral(x,y,angle,arms,spd,color,r, type){
  for(let i=0;i<arms;i++){
    const a = angle + i/arms*TAU;
    spawnBullet(x,y,Math.cos(a)*spd,Math.sin(a)*spd,color,r,type);
  }
}

// ---------- 敌人 ----------
function makeEnemy(type,x,y){
  const e = {x,y,type,t:0,fireT:rand(20,50),hp:6,r:14,dead:false, vy:rand(.5,1.2), vx:rand(-.6,.6), hue:rand(0,360)};
  if(type==='fairy'){ e.hp=5; e.vy=rand(.7,1.3); }
  if(type==='spiral'){ e.hp=14; e.vy=.6; e.spiral=rand(0,TAU); }
  if(type==='shooter'){ e.hp=10; e.vy=.8; }
  return e;
}
function updateEnemy(e){
  e.t++;
  e.fireT--;
  // 运动
  if(e.type==='fairy'){ e.x+=e.vx; e.y+=e.vy; if(e.y>H+20||e.x<-20||e.x>W+20) e.dead=true; }
  else { // 进入后悬停
    if(e.y<140) e.y+=e.vy; else { e.x+=Math.sin(e.t*0.03)*0.9; }
  }
  // 开火
  if(e.y>0 && e.y<H-80){
    if(e.type==='fairy' && e.fireT<=0){
      fireAimed(e.x,e.y,2.2,'#ff7ec8',4.5,'rice');
      e.fireT=rand(100,160);
    }
    if(e.type==='shooter' && e.fireT<=0){
      fireFan(e.x,e.y,3,0.9,1.9,Math.atan2(player.y-e.y,player.x-e.x),'#7ed0ff',4.2,'pellet');
      e.fireT=rand(85,135);
    }
    if(e.type==='spiral'){
      e.spiral+=0.12;
      if(e.fireT<=0){ fireSpiral(e.x,e.y,e.spiral,2,1.9,'#c08bff',4.8,'star'); e.fireT=12; }
    }
  }
  // 受击
  for(const s of pShots){
    const dmg=applyShot(s,e,e.x,e.y,e.r);
    if(dmg){
      e.hp-=dmg; spark(e.x,e.y,'#fff',4);
      if(e.hp<=0 && !e.dead){ killEnemy(e); }
    }
  }
}
function killEnemy(e){
  e.dead=true; addScore(120, e.x, e.y);
  bombGauge=Math.min(100,bombGauge+8);
  spark(e.x,e.y,'hsl('+e.hue+',90%,65%)',16);
}

// ---------- Boss ----------
function spawnBoss(actIdx){
  const bossHp = [600, 950, 1400][actIdx];
  boss = {
    x:W/2, y:-60, tx:W/2, ty:130, t:0, phase:0, fireT:40, hp:bossHp, maxhp:bossHp,
    r:[35,32,34][actIdx], entering:true, enterT:0, enterHold:0, enterDur:72, hue:200, patternT:0, defeated:false, deathT:0, act:actIdx,
    phaseFlash:0, hitFlash:0, trail:[], px:W/2, anim:{name:'idle',t:0,dur:1},
    name:['闻白 · 星界咏唱','私教 · 铁拳教头','薛埠王 · 拳镇山河'][actIdx]
  };
  bossActive=true;
}
function playBossAnim(b, name, dur){
  if(b.anim && b.anim.name===name && b.anim.t < dur*0.28) return;
  b.anim = {name, t:0, dur};
}
function bossDidFire(b){
  const a=b.act, p=b.phase;
  if(a===0) playBossAnim(b, p>=2?'cast2':'cast', p===0?34:22);
  else if(a===1) playBossAnim(b, p===1?'dual':'punch', p===2?15:26);
  else playBossAnim(b, 'punch', p===0?38: p===1?16:20);
}
function announcePhase(b){
  b.phaseFlash=42; b.fireT=36;
  spark(b.x,b.y, b.phase===2?'#ff6a8a':'#c08bff', 32);
  playBossAnim(b, b.act===0?'cast2':'punch', 40);
  floaters.push({x:W/2,y:H*0.34,text:PHASE_NAMES[b.act][b.phase],life:78,max:78,color:'#fff',big:true,vy:-0.15});
}
function updateBossFire(b){
  const a=b.act, p=b.phase;
  if(a===0){ // 闻白 · 星界咏唱
    if(p===0){
      if(b.fireT<=0){
        fireRing(b.x,b.y,12,1.32,'#ff9ad4',5.6, b.t*0.018,'rice');
        b.fireT=40;
      }
    } else if(p===1){
      b.patternT+=0.08;
      if(b.fireT<=0){
        fireSpiral(b.x,b.y,b.patternT,3,1.8,'#c4a0ff',6.2,'star');
        fireAimed(b.x,b.y,2.15,'#ffe57a',4.4,'pellet');
        b.fireT=15;
      }
    } else {
      b.patternT+=0.11;
      if(b.fireT<=0){
        fireRing(b.x,b.y,16,1.65,'#ff6ad5',5.2, b.patternT,'petal');
        fireRing(b.x,b.y,10,2.25,'#7ed0ff',4.6, -b.patternT,'rice');
        fireAimed(b.x,b.y,2.7,'#ffd76a',5,'knife');
        b.fireT=12;
      }
    }
  } else if(a===1){ // 私教 · 铁拳教头
    if(p===0){
      if(b.fireT<=0){
        const ang=Math.atan2(player.y-b.y, player.x-b.x);
        fireFan(b.x,b.y,5,0.72,2.35,ang,'#ffb347',7.2,'orb');
        b.fireT=34;
      }
    } else if(p===1){
      if(b.fireT<=0){
        const ang=Math.atan2(player.y-b.y, player.x-b.x);
        fireFan(b.x-30,b.y+8,3,0.32,2.55,ang,'#d8e4ff',5,'knife');
        fireFan(b.x+30,b.y+8,3,0.32,2.55,ang,'#ff8a6a',5,'knife');
        b.fireT=16;
      }
    } else {
      if(b.fireT<=0){
        for(let i=0;i<6;i++){
          const a0=rand(0,TAU), sp=rand(1.35,2.7);
          spawnBullet(b.x,b.y,Math.cos(a0)*sp,Math.sin(a0)*sp,'#ff5a5a',6.4,'square');
        }
        fireAimed(b.x,b.y,3.0,'#fff4c2',5.2,'orb');
        b.fireT=10;
      }
    }
  } else { // 薛埠王 · 拳镇山河
    if(p===0){
      if(b.fireT<=0){
        fireRing(b.x,b.y,10,1.12,'#ffd76a',8.5, b.t*0.01,'orb');
        b.fireT=44;
      }
    } else if(p===1){
      b.patternT+=0.105;
      if(b.fireT<=0){
        fireSpiral(b.x,b.y,b.patternT,4,2.12,'#ff8c42',5.6,'knife');
        b.fireT=8;
      }
    } else {
      if(b.fireT<=0){
        fireRing(b.x,b.y,8,1.02,'#ff6a3a',11, b.t*0.04,'orb');
        fireRing(b.x,b.y,18,2.35,'#ffe0a0',3.4, b.t*0.08,'rice');
        fireAimed(b.x,b.y,3.15,'#ffffff',4.2,'knife');
        b.fireT=14;
      }
    }
  }
}
function updateBoss(){
  const b=boss; b.t++;
  if(b.phaseFlash>0) b.phaseFlash--;
  if(b.hitFlash>0) b.hitFlash--;
  if(b.entering){
    b.enterT++;
    b.y += (b.ty-b.y)*0.10;
    if(Math.abs(b.y-b.ty)<2){ b.y=b.ty; b.enterHold++; if(b.enterHold>=42){ b.entering=false; b.fireT=40; } }
    b.px=b.x;
    return;
  }
  // 横向漂移：阶段越高越活跃
  if(b.phase===0){ b.x = W/2 + Math.sin(b.t*0.012)*100; b.y = 130; }
  else if(b.phase===1){ b.x = W/2 + Math.sin(b.t*0.022)*135; b.y = 126 + Math.sin(b.t*0.03)*10; }
  else { b.x += (clamp(player.x,90,W-90)-b.x)*0.025; b.y = 130 + Math.sin(b.t*0.04)*18; }
  b.trail.push({x:b.x,y:b.y}); if(b.trail.length>8) b.trail.shift();
  b.px=b.x;
  // 立绘周边灵气粒子
  if(!b.defeated && b.t%3===0){
    const cols=['#c4a0ff','#ffc878','#ff8c42'];
    const a=rand(0,TAU), rr=rand(28,70);
    particles.push({x:b.x+Math.cos(a)*rr, y:b.y+Math.sin(a)*rr*0.55, vx:rand(-0.35,0.35), vy:rand(-1.5,-0.35),
      life:randi(22,44), max:44, color:cols[b.act], r:rand(1.1,2.6)});
  }
  // 阶段切换
  const ratio = b.hp/b.maxhp;
  if(ratio<.34 && b.phase<2){ b.phase=2; announcePhase(b); }
  else if(ratio<.67 && b.phase<1){ b.phase=1; announcePhase(b); }

  if(!b.defeated){
    b.fireT--;
    const ready=b.fireT<=0;
    updateBossFire(b);
    if(ready) bossDidFire(b);
  }
  if(b.anim){ b.anim.t++; if(b.anim.t>=b.anim.dur) b.anim={name:'idle',t:0,dur:1}; }
  // 受击
  for(const s of pShots){
    const dmg=applyShot(s,b,b.x,b.y,b.r);
    if(dmg){
      b.hp-=dmg; spark(s.x,s.y,'#fff',3); b.hitFlash=7;
      if(!b.anim || b.anim.name==='idle') playBossAnim(b,'hurt',14);
      score+=5;
    }
  }
  if(b.hp<=0 && !b.defeated){
    b.defeated=true; b.deathT=0; addScore(100000, b.x, b.y, '#ffd76a', true); shake=18;
  }
  if(b.defeated){
    b.deathT++;
    if(b.deathT%3===0) spark(rand(b.x-30,b.x+30),rand(b.y-30,b.y+30),'hsl('+randi(0,360)+',90%,65%)',10);
    if(b.deathT>120){
      for(let i=0;i<60;i++) spark(rand(0,W),rand(0,H*0.6),'hsl('+randi(0,360)+',90%,65%)',14);
      bossActive=false; bossesDefeated++; boss=null;
      if(bossesDefeated<3){ act++; waveCount=0; spawnTimer=40; }
    }
  }
}

const BOSS_PARTS = [
  { // 闻白：头 / 羽毛笔(右) / 书本(左)
    head:{x:.30,y:.02,w:.42,h:.36,px:.5,py:.92},
    armR:{x:.54,y:.10,w:.42,h:.46,px:.16,py:.74},
    armL:{x:.08,y:.34,w:.40,h:.42,px:.78,py:.30}
  },
  { // 私教：交叉双臂
    head:{x:.36,y:.08,w:.28,h:.22,px:.5,py:.95},
    armR:{x:.50,y:.25,w:.28,h:.30,px:.12,py:.42},
    armL:{x:.24,y:.25,w:.28,h:.30,px:.88,py:.42}
  },
  { // 薛埠王：迎面拳
    head:{x:.28,y:.03,w:.40,h:.34,px:.5,py:.9},
    armR:{x:.38,y:.18,w:.54,h:.54,px:.22,py:.58},
    armL:{x:.08,y:.28,w:.32,h:.36,px:.76,py:.42}
  }
];
function regionW(u,v,rg){
  const cu=rg.x+rg.w*.5, cv=rg.y+rg.h*.5;
  const du=(u-cu)/(rg.w*.58), dv=(v-cv)/(rg.h*.58);
  return Math.max(0, 1-(du*du+dv*dv));
}
function getBossPose(b){
  const t=b.entering?b.enterT:b.t;
  const anim=b.anim||{name:'idle',t:0,dur:1};
  const p=clamp(anim.t/Math.max(1,anim.dur),0,1);
  const eo=x=>1-Math.pow(1-x,3);
  let pose={
    t,
    headX:Math.sin(t*0.033)*3.4, headY:Math.sin(t*0.047)*2.4, headRot:Math.sin(t*0.029)*0.05,
    armL:Math.sin(t*0.06+0.8)*0.08, armR:Math.sin(t*0.07)*0.09,
    punch:0, raise:0, lean:0, lunge:0
  };
  if(b.hitFlash>0){ pose.headX+=6; pose.headRot+=0.1; pose.lean-=0.05; }
  if(b.defeated){ pose.headRot+=b.deathT*0.012; pose.armL-=b.deathT*0.01; pose.armR+=b.deathT*0.01; }
  const n=anim.name;
  if(n==='cast'||n==='cast2'){
    const wind=p<0.28?eo(p/0.28):p<0.5?1:1-Math.pow((p-0.5)/0.5,2);
    const strike=p>=0.28&&p<0.55?Math.sin((p-0.28)/0.27*Math.PI):0;
    pose.raise=wind; pose.armR+=-0.62*wind-(n==='cast2'?0.18:0);
    pose.armL+=0.22*wind; pose.headRot+=-0.1*wind;
    pose.lean+=-0.07*wind+strike*0.16; pose.lunge=strike*8;
  } else if(n==='punch'){
    const wind=p<0.22?eo(p/0.22):0;
    const strike=p>=0.16&&p<0.5?Math.sin((p-0.16)/0.34*Math.PI):0;
    pose.armR+=-0.5*wind+0.62*strike; pose.armL+=0.18*Math.max(wind,strike*0.4);
    pose.punch=strike; pose.lean+=-0.09*wind+0.2*strike;
    pose.lunge=strike*(b.act===2?18:12); pose.headY+=-5*strike; pose.headRot+=0.12*strike;
  } else if(n==='dual'){
    const s=Math.sin(p*Math.PI), side=p<0.5?1:-1;
    pose.armR+=0.55*s*(side>0?1:0.25); pose.armL+=-0.55*s*(side<0?1:0.25);
    pose.punch=s*0.65; pose.lean+=0.14*s*side; pose.lunge=s*10;
  } else if(n==='hurt'){
    const s=Math.sin(p*Math.PI);
    pose.headX+=8*s; pose.headRot+=0.16*s; pose.lean-=0.1*s; pose.armL-=0.2*s; pose.armR+=0.15*s;
  }
  return pose;
}
function drawWarpedBoss(src, sz, pose, parts){
  const cols=8, rows=10, cw=sz/cols, ch=sz/rows;
  const hx=(parts.head.x+parts.head.px*parts.head.w)*sz, hy=(parts.head.y+parts.head.py*parts.head.h)*sz;
  const rx=(parts.armR.x+parts.armR.px*parts.armR.w)*sz, ry=(parts.armR.y+parts.armR.py*parts.armR.h)*sz;
  const lx=(parts.armL.x+parts.armL.px*parts.armL.w)*sz, ly=(parts.armL.y+parts.armL.py*parts.armL.h)*sz;
  const fcx=(parts.armR.x+parts.armR.w*0.58)*sz, fcy=(parts.armR.y+parts.armR.h*0.42)*sz;
  const warp=(u,v)=>{
    let x=u*sz, y=v*sz;
    const rot=(px,py,ang,w)=>{
      if(w<=0.002||Math.abs(ang)<1e-4) return;
      const a=ang*w, c=Math.cos(a), s=Math.sin(a), dx=x-px, dy=y-py;
      x=px+dx*c-dy*s; y=py+dx*s+dy*c;
    };
    const hw=regionW(u,v,parts.head);
    x+=pose.headX*hw; y+=pose.headY*hw; rot(hx,hy,pose.headRot,hw);
    const rw=regionW(u,v,parts.armR);
    rot(rx,ry,pose.armR,rw);
    if(pose.punch>0 && rw>0){
      const k=1+pose.punch*0.5*rw;
      x=fcx+(x-fcx)*k; y=fcy+(y-fcy)*(1+pose.punch*0.22*rw)+pose.punch*rw*14;
    }
    const lw=regionW(u,v,parts.armL);
    rot(lx,ly,pose.armL,lw);
    x+=pose.lean*v*sz*0.14 + Math.sin(v*3.1+pose.t*0.07)*1.4;
    y+=pose.raise*-(1-v)*10 + Math.sin(pose.t*0.055+u)*v*2.2;
    return {x:x-sz/2, y:y-sz/2};
  };
  for(let j=0;j<rows;j++){
    for(let i=0;i<cols;i++){
      const u0=i/cols, v0=j/rows, u1=(i+1)/cols, v1=(j+1)/rows;
      const p00=warp(u0,v0), p10=warp(u1,v0), p01=warp(u0,v1);
      ctx.save();
      ctx.transform((p10.x-p00.x)/cw,(p10.y-p00.y)/cw,(p01.x-p00.x)/ch,(p01.y-p00.y)/ch,p00.x,p00.y);
      ctx.drawImage(src, u0*sz, v0*sz, cw+1.2, ch+1.2, 0, 0, cw+1.2, ch+1.2);
      ctx.restore();
    }
  }
}
function drawBossSprite(b){
  const img = bossImgs[b.act];
  const t = b.entering ? b.enterT : b.t;
  const sz = [150,168,165][b.act];
  const phRGB = b.phase===2 ? '255,70,80' : (b.phase===1 ? '180,90,255' : '90,200,255');
  const breathe = 1 + Math.sin(t*0.055)*0.04;
  const squash = 1 + Math.sin(t*0.055+1.1)*0.025;
  const sway = Math.sin(t*0.032)*0.05;
  const dy = b.entering ? 0 : Math.sin(t*0.048)*6;
  const prev = b.trail.length>1 ? b.trail[b.trail.length-2] : null;
  const vx = prev ? b.x-prev.x : 0;
  const lean = clamp(vx*0.05, -0.14, 0.14);
  const cast = (!b.entering && !b.defeated && b.fireT>=0 && b.fireT<10) ? (1-b.fireT/10) : 0;
  const pose = getBossPose(b);
  const rage = (!b.entering && b.phase===2) ? Math.sin(t*0.9)*1.8 : 0;
  let sc = breathe + pose.raise*0.03 + pose.punch*0.06 + (b.hitFlash>0?0.03:0);
  let al = 1;
  if(b.entering){ sc = (0.5+0.5*Math.min(1,b.enterT/45))*breathe; al=Math.min(1,b.enterT/18); }
  if(b.defeated){ sc *= 1+b.deathT*0.005; al *= Math.max(0,1-b.deathT/110); }

  if(!drawBossSprite._c){ drawBossSprite._c=document.createElement('canvas'); drawBossSprite._cctx=drawBossSprite._c.getContext('2d'); }
  const fx=drawBossSprite._c, fctx=drawBossSprite._cctx;
  if(fx.width!==sz){ fx.width=sz; fx.height=sz; }
  fctx.clearRect(0,0,sz,sz);
  fctx.globalCompositeOperation='source-over';
  fctx.drawImage(img,0,0,sz,sz);
  fctx.globalCompositeOperation='source-atop';
  const wa = 0.08 + 0.08*Math.sin(t*0.11) + b.phase*0.06 + cast*0.14;
  fctx.fillStyle='rgba('+phRGB+','+wa.toFixed(3)+')';
  fctx.fillRect(0,0,sz,sz);
  if(b.hitFlash>0){ fctx.fillStyle='rgba(255,255,255,'+(b.hitFlash/8*0.75)+')'; fctx.fillRect(0,0,sz,sz); }
  fctx.globalCompositeOperation='source-over';

  const blit = (src, s, alpha, extra=0)=>{
    ctx.save();
    ctx.translate(rage, dy);
    ctx.rotate(sway+lean + extra);
    ctx.scale(s*squash, s/squash);
    ctx.globalAlpha = alpha;
    ctx.drawImage(src, -sz/2, -sz/2, sz, sz);
    ctx.restore();
  };

  // 移动残影
  if(!b.entering && b.trail){
    for(let i=0;i<b.trail.length;i+=2){
      const p=b.trail[i], k=i/b.trail.length;
      ctx.save();
      ctx.globalAlpha = al*0.16*k;
      ctx.translate(p.x-b.x, p.y-b.y+dy);
      ctx.rotate(sway);
      ctx.scale(sc*0.97, sc*0.97);
      ctx.drawImage(img, -sz/2, -sz/2, sz, sz);
      ctx.restore();
    }
  }

  ctx.save();
  ctx.globalCompositeOperation='lighter';
  blit(img, sc*(1.07+cast*0.06+pose.punch*0.04), (0.2+0.12*Math.sin(t*0.1)+cast*0.42+pose.punch*0.25)*al);
  ctx.restore();
  ctx.save();
  ctx.translate(rage + pose.lunge*0.15, dy + pose.punch*4);
  ctx.rotate(sway+lean + pose.lean*0.35 + (b.defeated? b.deathT*0.07:0));
  ctx.scale(sc*squash, sc/squash);
  ctx.globalAlpha = al;
  drawWarpedBoss(fx, sz, pose, BOSS_PARTS[b.act]);
  ctx.restore();

  // 高光扫过
  if(!b.defeated){
    ctx.save();
    ctx.translate(0, dy);
    ctx.beginPath(); ctx.arc(0,0,sz*0.48,0,TAU); ctx.clip();
    const sh = ((t*4)%(sz*2.2)) - sz*1.1;
    ctx.translate(sh, 0); ctx.rotate(-0.55);
    const hg=ctx.createLinearGradient(-18,0,18,0);
    hg.addColorStop(0,'rgba(255,255,255,0)');
    hg.addColorStop(.5,'rgba(255,255,255,'+(0.16+cast*0.2)+')');
    hg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=hg; ctx.fillRect(-24,-sz,48,sz*2);
    ctx.restore();
  }

  // 环绕粒子 / 符文
  const n = 7 + b.phase*3;
  for(let i=0;i<n;i++){
    const a = t*(0.025+b.phase*0.01)*(i%2?1:-1) + i/n*TAU;
    const R = sz*(0.40+0.04*b.phase) + Math.sin(t*0.06+i)*10;
    const x=Math.cos(a)*R, y=Math.sin(a)*R*0.52 + dy;
    ctx.fillStyle='rgba('+phRGB+','+(0.4+0.4*Math.sin(t*0.12+i))+')';
    ctx.beginPath(); ctx.arc(x,y, 1.6+b.phase*0.5+(i%3===0?1.4:0), 0, TAU); ctx.fill();
  }
  if(b.act===0){ // 星屑
    ctx.save(); ctx.translate(0,dy); ctx.rotate(t*0.01);
    ctx.strokeStyle='rgba('+phRGB+',.45)'; ctx.lineWidth=1.2;
    ctx.beginPath();
    for(let i=0;i<5;i++){ const a=-Math.PI/2+i*TAU/5, R=sz*0.56; i?ctx.lineTo(Math.cos(a)*R,Math.sin(a)*R):ctx.moveTo(Math.cos(a)*R,Math.sin(a)*R); }
    ctx.closePath(); ctx.stroke();
    ctx.restore();
  } else if(b.act===1 && !b.entering){ // 拳风冲击圈
    const rt = (t%36)/36;
    ctx.strokeStyle='rgba('+phRGB+','+(0.55*(1-rt))+')'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,dy, 20+rt*(sz*0.55+cast*20), 0, TAU); ctx.stroke();
  } else if(b.act===2){ // 焰舌
    for(let i=0;i<5;i++){
      const a=-Math.PI/2+(i-2)*0.22, fl=28+Math.sin(t*0.25+i)*16;
      ctx.fillStyle='rgba(255,'+(90+i*20)+',40,'+(0.28+0.15*Math.sin(t*0.2+i))+')';
      ctx.beginPath(); ctx.moveTo(0,dy+18);
      ctx.lineTo(Math.cos(a-0.12)*fl, dy+18+Math.sin(a-0.12)*fl);
      ctx.lineTo(Math.cos(a+0.12)*fl, dy+18+Math.sin(a+0.12)*fl);
      ctx.closePath(); ctx.fill();
    }
  }

  ctx.strokeStyle='rgba(255,240,200,'+(0.45+0.25*Math.sin(t*0.1)+cast*0.4)+')';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0, dy, sz/2+10+Math.sin(t*0.1)*4+cast*8, 0, TAU); ctx.stroke();
}
const ENT_COL = ['180,120,255','200,200,170','255,140,40'];
function drawBossEntrance(b){
  const t = b.enterT;
  // 多重扩散光环
  for(let k=0;k<3;k++){
    const rt = t*4 - k*22;
    if(rt>0){
      const rr = (rt/72)*260;
      const a = Math.max(0, 1 - rt/72)*0.6;
      ctx.strokeStyle = 'rgba('+ENT_COL[b.act]+','+a.toFixed(3)+')';
      ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0,0,rr,0,TAU); ctx.stroke();
    }
  }
  if(b.act===0){
    ctx.save(); ctx.rotate(t*0.02);
    ctx.strokeStyle='rgba(180,120,255,.85)'; ctx.lineWidth=2;
    for(let ring=1;ring<=2;ring++){
      const R=40*ring+14; ctx.beginPath();
      for(let i=0;i<6;i++){ const a=i/6*TAU, x=Math.cos(a)*R, y=Math.sin(a)*R; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
      ctx.closePath(); ctx.stroke();
    }
    for(let i=0;i<12;i++){ const a=i/12*TAU; ctx.beginPath(); ctx.moveTo(Math.cos(a)*50,Math.sin(a)*50); ctx.lineTo(Math.cos(a)*120,Math.sin(a)*120); ctx.stroke(); }
    ctx.restore();
  } else if(b.act===1){
    ctx.fillStyle='rgba(40,30,30,.6)';
    ctx.beginPath(); ctx.moveTo(-130,120); ctx.lineTo(-60,40); ctx.lineTo(-10,95); ctx.lineTo(40,30); ctx.lineTo(110,100); ctx.lineTo(140,120); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(220,220,200,.5)'; ctx.lineWidth=2;
    for(let i=0;i<6;i++){ const yy=60+i*12, off=(t*3+i*30)%200-100; ctx.beginPath(); ctx.moveTo(-130+off,yy); ctx.lineTo(-60+off,yy-6); ctx.stroke(); }
  } else {
    ctx.save();
    for(let i=0;i<7;i++){
      const a=-Math.PI/2+(i-3)*0.18, fl=60+Math.sin(t*0.3+i)*25;
      ctx.fillStyle='rgba(255,'+(80+(i%2)*40)+',30,.7)';
      ctx.beginPath(); ctx.moveTo(0,40);
      ctx.lineTo(Math.cos(a-0.08)*fl, 40+Math.sin(a-0.08)*fl);
      ctx.lineTo(Math.cos(a+0.08)*fl, 40+Math.sin(a+0.08)*fl);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle='rgba(255,170,60,.7)'; ctx.lineWidth=4;
    const rr=(t/30)*160; ctx.beginPath(); ctx.arc(0,0,rr,0,TAU); ctx.stroke();
  }
  // 名字横幅
  ctx.save();
  let ba = Math.min(1, t/15);
  if(t > b.enterDur-20) ba *= Math.max(0, 1-(t-(b.enterDur-20))/20);
  ctx.globalAlpha = ba; ctx.fillStyle='#fff'; ctx.textAlign='center';
  ctx.shadowColor='#000'; ctx.shadowBlur=8;
  ctx.font='bold 22px sans-serif'; ctx.fillText('⚠ 第'+(b.act+1)+'幕 BOSS ⚠', 0, -150);
  ctx.font='bold 16px sans-serif'; ctx.fillText(b.name, 0, -126);
  ctx.restore();
}

// ---------- 玩家射击 ----------
function hitShot(s,x,y,tr){
  if(s.kind==='wave'){
    const ang=Math.atan2(s.vy,s.vx), dx=x-s.x, dy=y-s.y;
    const ca=Math.cos(-ang), sa=Math.sin(-ang);
    const lx=dx*ca-dy*sa, ly=dx*sa+dy*ca;
    const hw=(s.hw||14)+tr, hh=s.r+tr;
    return (lx*lx)/(hw*hw)+(ly*ly)/(hh*hh)<=1;
  }
  return dist2(s.x,s.y,x,y)<(s.r+tr)**2;
}
function applyShot(s, target, x,y,r){
  if(s.dead || !hitShot(s,x,y,r)) return 0;
  if(s.pierce){
    if(!s.hitSet) s.hitSet=new Set();
    if(s.hitSet.has(target)) return 0;
    s.hitSet.add(target);
  } else s.dead=true;
  return s.power||1;
}
function playerShoot(){
  if(player.fireCd>0){ player.fireCd--; return; }
  const x=player.x, y=player.y;
  switch(player.weapon){
    case 0: { // 散弹：近距霰弹，贴脸打满，远程散开
      player.fireCd=9;
      for(let i=-3;i<=3;i++){
        const a=-Math.PI/2 + i*0.09 + rand(-0.025,0.025);
        const sp=9.2+Math.abs(i)*0.25;
        pShots.push({x:x+i*2,y:y-10,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:2.7,power:1,kind:'pellet',dead:false});
      }
      spark(x,y-8,'#ffe08a',4);
      break;
    }
    case 1: // 速射：细而快的集中弹，远距最稳
      player.fireCd=5;
      pShots.push({x:x-3,y:y-16,vx:0,vy:-16,r:3.2,power:2,kind:'focus',dead:false});
      pShots.push({x:x+3,y:y-16,vx:0,vy:-16,r:3.2,power:2,kind:'focus',dead:false});
      break;
    case 2: // 追踪：慢速导弹，弱诱导，单发高伤
      player.fireCd=6;
      pShots.push({x:x-12,y:y-10,vx:-1.0,vy:-7.2,r:4,power:2,kind:'missile',homing:true,homeDelay:8,homeLife:52,dead:false});
      pShots.push({x:x+12,y:y-10,vx: 1.0,vy:-7.2,r:4,power:2,kind:'missile',homing:true,homeDelay:8,homeLife:52,dead:false});
      break;
    case 3: // 光波：宽幅贯穿波，清列强、打 Boss 看覆盖
      player.fireCd=8;
      for(let i=-1;i<=1;i++){
        pShots.push({x:x+i*8,y:y-12,vx:i*0.85,vy:-8.2,r:5.5,hw:16,power:2,kind:'wave',pierce:true,dead:false});
      }
      break;
  }
}

// ---------- 炸弹/符卡 ----------
function useBomb(){
  if(bombs<=0 || state!=='playing' || spellAnim) return;
  bombs--; bombGauge=0; player.inv=Math.max(player.inv,360); shake=10;
  spellAnim={t:0}; // 进入符卡演出，真正清屏在演出结束后执行
  spellGif.src = document.getElementById('spellData').textContent; spellName.textContent='召唤蛋神'; spellOverlay.classList.add('show'); // 显示 DOM 演出层（GIF 开始播放）
}
function doBombClear(){
  // 真正清屏
  pBullets.forEach(b=>{ spark(b.x,b.y,b.color,3); });
  pBullets=[];
  // 伤害敌人
  enemies.forEach(e=>{ e.hp-=30; if(e.hp<=0) killEnemy(e); });
  if(boss && !boss.entering){ boss.hp-=120; if(boss.hp<=0 && !boss.defeated){ boss.defeated=true; boss.deathT=0; } }
  // 圆环冲击波
  particles.push({ring:true, x:player.x, y:player.y, r:0, max:420, life:40, t:0});
}

// ---------- 粒子/擦弹 ----------
function spark(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=rand(0,TAU), sp=rand(.5,3.5);
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:randi(14,30),max:30,color,r:rand(1,2.6)});
  }
}
function addScore(n,x,y,color='#ffe57a',big=false){
  score+=n;
  floaters.push({x,y,text:'+'+n,life:big?80:45,max:big?80:45,color,big,vy:-0.8});
}

// 掉落物逻辑已移除（不再有能量球）

// ---------- 玩家更新 ----------
function updatePlayer(){
  const sp = keys.boost ? player.boostSpeed : player.speed;
  let dx=0,dy=0;
  if(keys.left) dx-=1; if(keys.right) dx+=1; if(keys.up) dy-=1; if(keys.down) dy+=1;
  if(dx&&dy){ dx*=0.707; dy*=0.707; }
  player.x=clamp(player.x+dx*sp,20,W-20);
  player.y=clamp(player.y+dy*sp,22,H-22);

  playerShoot(); // 自动射击

  if(keys.bomb){ keys.bomb=false; useBomb(); }

  if(player.inv>0) player.inv--;

  // 碰撞 & 擦弹
  for(const b of pBullets){
    const d2 = dist2(b.x,b.y,player.x,player.y);
    if(d2 < (b.r+player.r)**2){
      if(player.inv<=0){ hitPlayer(); return; }
    } else if(d2 < (b.r+player.grazeR)**2){
      if(!b.grazed){ b.grazed=true; graze++; score+=30; bombGauge=Math.min(100,bombGauge+0.6); spark(b.x,b.y,'#fff',2); }
    }
  }
}
function hitPlayer(){
  lives--; shake=14;
  // 清掉玩家周围子弹
  pBullets = pBullets.filter(b=> dist2(b.x,b.y,player.x,player.y) > 80*80);
  spark(player.x,player.y,'#ff6060',24);
  if(lives<=0){ gameOver(false); }
  else { player.inv=150; player.x=W/2; player.y=H-110; }
}

// ---------- 主循环 ----------
function update(){
  time++;

  // 符卡演出期间：游戏逻辑暂停，只更新演出
  if(spellAnim){
    spellAnim.t++;
    // 名字一闪而过(约18帧)，图片进入(约36帧)，图片停留 40~100，图片退出 100~130，130 结束
    if(spellAnim.t>=100) spellOverlay.classList.add('fadeout'); // 图片开始淡出
    if(spellAnim.t===130){
      doBombClear();
      spellAnim=null;
      spellOverlay.classList.remove('show','fadeout'); // 隐藏演出层
    }
    return;
  }

  // 星空滚动
  stars.forEach(s=>{ s.y+=s.s*0.016; if(s.y>H){ s.y=0; s.x=rand(0,W); } });

  if(state!=='playing') return;

  score += 1; // 持续得分
  if(bombs<3) bombGauge = Math.min(100, bombGauge + 0.05);
  if(bombGauge>=100){ bombGauge=0; if(bombs<3) bombs++; }

  updatePlayer();
  if(state!=='playing') return;

  // 三幕流程：每幕若干小怪波次后出对应 Boss
  if(!bossActive && bossesDefeated<3){
    const A = ACTS[act];
    if(waveCount < A.waves){
      spawnTimer--;
      if(spawnTimer<=0){
        const pool=A.types;
        const t = pool[randi(0,pool.length-1)];
        const x=rand(50,W-50);
        enemies.push(makeEnemy(t,x,-20));
        waveCount++;
        spawnTimer = rand(A.spawnMin, A.spawnMax);
      }
    } else if(enemies.length===0){
      spawnBoss(act);
    }
  }

  enemies.forEach(updateEnemy);
  enemies=enemies.filter(e=>!e.dead);

  if(boss) updateBoss();

  // 自机弹
  for(const s of pShots){
    if(s.homing){
      s.homeDelay--; s.homeLife--;
      if(s.homeDelay<=0 && s.homeLife>0){
        let best=null, bd=1e9;
        for(const e of enemies){ const d=dist2(s.x,s.y,e.x,e.y); if(d<bd){bd=d;best=e;} }
        if(boss && !boss.entering && !boss.defeated){ const d=dist2(s.x,s.y,boss.x,boss.y); if(d<bd){bd=d;best=boss;} }
        if(best && bd < 280*280){
          const desired=Math.atan2(best.y-s.y, best.x-s.x);
          let cur=Math.atan2(s.vy,s.vx);
          let diff=desired-cur; while(diff>Math.PI)diff-=TAU; while(diff<-Math.PI)diff+=TAU;
          if(Math.abs(diff)<1.25){
            cur+=clamp(diff,-0.065,0.065);
            const sp=Math.hypot(s.vx,s.vy);
            s.vx=Math.cos(cur)*sp; s.vy=Math.sin(cur)*sp;
          }
        }
      }
    }
    s.x+=s.vx; s.y+=s.vy;
    if(s.kind==='missile' && time%2===0){
      particles.push({x:s.x,y:s.y,vx:-s.vx*0.05,vy:-s.vy*0.05,life:10,max:10,color:'#ffb45a',r:1.4});
    }
    if(s.y<-20||s.x<-20||s.x>W+20||s.y>H+20) s.dead=true;
  }
  pShots=pShots.filter(s=>!s.dead);

  // 敌弹
  for(const b of pBullets){
    b.x+=b.vx; b.y+=b.vy; b.spin+=0.08;
    if(b.y>H+30||b.y<-40||b.x<-40||b.x>W+40) b.dead=true;
  }
  pBullets=pBullets.filter(b=>!b.dead);

  // 粒子
  for(const p of particles){
    if(p.ring){ p.t++; p.r=p.t/p.life*p.max; if(p.t>=p.life) p.dead=true; }
    else { p.x+=p.vx; p.y+=p.vy; p.vy+=0.04; p.life--; if(p.life<=0) p.dead=true; }
  }
  particles=particles.filter(p=>!p.dead);

  for(const f of floaters){ f.y+=f.vy; f.life--; }
  floaters=floaters.filter(f=>f.life>0);

  if(shake>0) shake*=0.85;
}

function hexToRgb(c){
  if(c[0]==='#'){
    const n=c.length===4
      ? c.slice(1).split('').map(ch=>ch+ch).join('')
      : c.slice(1,7);
    const v=parseInt(n,16);
    return [(v>>16)&255,(v>>8)&255,v&255];
  }
  const m=c.match(/hsl\((\d+)/);
  if(m){
    const h=(+m[1])/60, x=1-Math.abs(h%2-1);
    const rgb=h<1?[1,x,0]:h<2?[x,1,0]:h<3?[0,1,x]:h<4?[0,x,1]:h<5?[x,0,1]:[1,0,x];
    return rgb.map(v=>Math.round(v*220));
  }
  return [255,180,200];
}
function drawBullet(b){
  const ang=Math.atan2(b.vy,b.vx);
  const [cr,cg,cb]=hexToRgb(b.color);
  const type=b.type||'pellet';
  ctx.save();
  ctx.translate(b.x,b.y);
  ctx.fillStyle='rgba('+cr+','+cg+','+cb+',.35)';
  ctx.beginPath(); ctx.arc(0,0,b.r+4,0,TAU); ctx.fill();
  ctx.fillStyle=b.color;
  ctx.rotate(ang);
  if(type==='rice'){
    ctx.beginPath(); ctx.ellipse(0,0,b.r*1.85,b.r*0.62,0,0,TAU); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(b.r*0.25,0,b.r*0.7,b.r*0.28,0,0,TAU); ctx.fill();
  } else if(type==='knife'){
    ctx.beginPath();
    ctx.moveTo(b.r*2.1,0); ctx.lineTo(-b.r*0.9,b.r*0.72); ctx.lineTo(-b.r*0.35,0); ctx.lineTo(-b.r*0.9,-b.r*0.72);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(b.r*1.1,0); ctx.lineTo(-0.2,b.r*0.28); ctx.lineTo(-0.2,-b.r*0.28); ctx.closePath(); ctx.fill();
  } else if(type==='star'){
    ctx.rotate(b.spin);
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const rr=i%2? b.r*0.42 : b.r*1.15;
      const a=-Math.PI/2+i*Math.PI/5;
      i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,b.r*0.28,0,TAU); ctx.fill();
  } else if(type==='petal'){
    ctx.beginPath(); ctx.ellipse(b.r*0.15,0,b.r*1.55,b.r*0.78,0,0,TAU); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(b.r*0.35,0,b.r*0.55,b.r*0.32,0,0,TAU); ctx.fill();
  } else if(type==='square'){
    ctx.rotate(b.spin*0.6);
    ctx.fillRect(-b.r,-b.r,b.r*2,b.r*2);
    ctx.fillStyle='#fff'; ctx.fillRect(-b.r*0.4,-b.r*0.4,b.r*0.8,b.r*0.8);
  } else if(type==='orb'){
    ctx.beginPath(); ctx.arc(0,0,b.r,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(0,0,b.r*0.72,0,TAU); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-b.r*0.28,-b.r*0.28,b.r*0.28,0,TAU); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0,0,b.r,0,TAU); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-b.r*0.15,-b.r*0.15,b.r*0.38,0,TAU); ctx.fill();
  }
  ctx.restore();
}

// ---------- 渲染 ----------
function render(){
  ctx.clearRect(0,0,W,H);
  // 背景渐变 + 月亮
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0820'); bg.addColorStop(1,'#05030f');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // 月亮
  const mg=ctx.createRadialGradient(W*0.72,120,10,W*0.72,120,90);
  mg.addColorStop(0,'rgba(255,245,210,.95)'); mg.addColorStop(.7,'rgba(230,220,180,.5)'); mg.addColorStop(1,'rgba(230,220,180,0)');
  ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(W*0.72,120,90,0,TAU); ctx.fill();
  ctx.fillStyle='rgba(255,248,225,.9)'; ctx.beginPath(); ctx.arc(W*0.72,120,46,0,TAU); ctx.fill();

  // 星空
  stars.forEach(s=>{ ctx.globalAlpha=s.a; ctx.fillStyle='#cfd6ff'; ctx.fillRect(s.x,s.y,s.r,s.r); });
  ctx.globalAlpha=1;

  if(state==='playing'||state==='over'){
    ctx.save();
    if(shake>0.5){ ctx.translate(rand(-shake,shake),rand(-shake,shake)); }

    // 敌人
    enemies.forEach(e=>{
      const c='hsl('+e.hue+',80%,62%)';
      ctx.fillStyle=c; ctx.globalAlpha=.3; ctx.beginPath(); ctx.arc(e.x,e.y,e.r+5,0,TAU); ctx.fill(); ctx.globalAlpha=1;
      ctx.fillStyle=c; ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,TAU); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(e.x-4,e.y-2,2,0,TAU); ctx.arc(e.x+4,e.y-2,2,0,TAU); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.beginPath(); ctx.arc(e.x,e.y-1,e.r*0.5,0.1,Math.PI-0.1); ctx.stroke();
    });

    // Boss
    if(boss){
      const b=boss;
      ctx.save(); ctx.translate(b.x,b.y);
      const phRGB = b.phase===2 ? '255,70,80' : (b.phase===1 ? '180,90,255' : '90,200,255');
      const glowR = [95,60,70][b.act] * (1 + b.phase*0.18);
      if(!b.entering){
        const glow=ctx.createRadialGradient(0,0,10,0,0,glowR);
        glow.addColorStop(0,'rgba('+phRGB+',.9)'); glow.addColorStop(1,'rgba('+phRGB+',0)');
        ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(0,0,glowR,0,TAU); ctx.fill();
        // 阶段装饰环，让形态一眼可辨
        ctx.save();
        ctx.rotate((b.t*(0.02+b.phase*0.02))*(b.phase===2?-1:1));
        ctx.strokeStyle='rgba('+phRGB+',.85)';
        ctx.lineWidth = 2 + b.phase;
        if(b.phase===0){
          ctx.beginPath(); ctx.arc(0,0, glowR*0.55, 0, TAU); ctx.stroke();
        } else if(b.phase===1){
          ctx.beginPath();
          for(let i=0;i<6;i++){
            const a=i/6*TAU, R=glowR*0.58;
            i?ctx.lineTo(Math.cos(a)*R,Math.sin(a)*R):ctx.moveTo(Math.cos(a)*R,Math.sin(a)*R);
          }
          ctx.closePath(); ctx.stroke();
        } else {
          ctx.beginPath();
          for(let i=0;i<16;i++){
            const a=i/16*TAU, R=glowR*(i%2?0.42:0.68);
            i?ctx.lineTo(Math.cos(a)*R,Math.sin(a)*R):ctx.moveTo(Math.cos(a)*R,Math.sin(a)*R);
          }
          ctx.closePath(); ctx.stroke();
        }
        ctx.restore();
      } else {
        drawBossEntrance(b);
      }
      const img = bossImgs[b.act];
      if(img && img.complete && img.naturalWidth){
        drawBossSprite(b);
      } else {
        ctx.fillStyle= b.phase===2?'#ff6a9a':(b.phase===1?'#9a7bff':'#7ed0ff');
        ctx.beginPath(); ctx.arc(0,0,b.r,0,TAU); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-7,-4,3,0,TAU); ctx.arc(7,-4,3,0,TAU); ctx.fill();
        ctx.strokeStyle='rgba(255,240,200,.5)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,b.r+12+Math.sin(b.t*0.1)*3,0,TAU); ctx.stroke();
      }
      ctx.restore();
      if(b.entering && b.enterT<12){ ctx.fillStyle='rgba(255,255,255,'+(0.5*(1-b.enterT/12))+')'; ctx.fillRect(0,0,W,H); }
      if(b.phaseFlash>0){
        ctx.fillStyle='rgba(255,255,255,'+(0.28*b.phaseFlash/42)+')'; ctx.fillRect(0,0,W,H);
      }
      // Boss 血条（醒目）
      const bw=W-80, bh=12, bx=40, by=32;
      ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(bx-2,by-2,bw+4,bh+4);
      ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(bx,by,bw,bh);
      const r=clamp(b.hp/b.maxhp,0,1);
      ctx.fillStyle = b.phase===2?'#ff4d6d':(b.phase===1?'#c77bff':'#5ad1ff');
      ctx.fillRect(bx,by,bw*r,bh);
      ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,bh);
      ctx.fillStyle='#fff'; ctx.font='12px sans-serif'; ctx.textAlign='left';
      ctx.fillText(b.name+'　'+PHASE_NAMES[b.act][b.phase]+'　'+Math.ceil(b.hp),bx,by-6);
    }

    // 玩家机体（子弹要盖在大模型上）
    if(!(state==='over')) player.draw('body');

    // 敌弹（画在机体之上，形状差异更清楚）
    pBullets.forEach(drawBullet);

    // 自机弹
    pShots.forEach(s=>{
      ctx.save();
      ctx.translate(s.x,s.y);
      if(s.kind==='pellet'){
        ctx.fillStyle='#ffe08a'; ctx.beginPath(); ctx.arc(0,0,s.r,0,TAU); ctx.fill();
        ctx.fillStyle='#fff6d2'; ctx.beginPath(); ctx.arc(-0.6,-0.6,s.r*0.4,0,TAU); ctx.fill();
      } else if(s.kind==='missile' || s.homing){
        ctx.rotate(Math.atan2(s.vy,s.vx)+Math.PI/2);
        ctx.fillStyle='#ff9a3a';
        ctx.beginPath(); ctx.moveTo(0,-10); ctx.lineTo(5.2,7); ctx.lineTo(0,3); ctx.lineTo(-5.2,7); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#fff0c8'; ctx.beginPath(); ctx.moveTo(0,-5); ctx.lineTo(2.1,2); ctx.lineTo(-2.1,2); ctx.closePath(); ctx.fill();
      } else if(s.kind==='wave'){
        ctx.rotate(Math.atan2(s.vy,s.vx));
        ctx.fillStyle='rgba(186,120,255,.82)';
        ctx.beginPath(); ctx.ellipse(0,0,s.hw||15,s.r,0,0,TAU); ctx.fill();
        ctx.strokeStyle='rgba(255,210,255,.95)'; ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.ellipse(0,0,s.hw||15,s.r,0,0,TAU); ctx.stroke();
      } else {
        ctx.rotate(Math.atan2(s.vy,s.vx)+Math.PI/2);
        ctx.fillStyle='#6ef3ff';
        ctx.beginPath(); ctx.ellipse(0,0,s.r*0.5,s.r*2.7,0,0,TAU); ctx.fill();
        ctx.fillStyle='#e7ffff'; ctx.beginPath(); ctx.ellipse(0,-2,s.r*0.22,s.r*1.5,0,0,TAU); ctx.fill();
      }
      ctx.restore();
    });

    // 粒子
    particles.forEach(p=>{
      if(p.ring){
        ctx.strokeStyle='rgba(255,200,240,'+(1-p.t/p.life)+')'; ctx.lineWidth=4;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.stroke();
      } else {
        ctx.globalAlpha=clamp(p.life/p.max,0,1); ctx.fillStyle=p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill(); ctx.globalAlpha=1;
      }
    });

    // 浮动得分（+N 提示）
    floaters.forEach(f=>{
      ctx.globalAlpha=clamp(f.life/f.max,0,1);
      ctx.fillStyle=f.color; ctx.textAlign='center';
      ctx.font=(f.big?'bold 36px':'bold 16px')+' sans-serif';
      ctx.shadowColor=f.color; ctx.shadowBlur=f.big?12:4;
      ctx.fillText(f.text, f.x, f.y);
      ctx.shadowBlur=0; ctx.globalAlpha=1;
    });
    ctx.textAlign='left';

    // 玩家判定点（最上层，便于读弹）
    if(!(state==='over')) player.draw('hit');
    ctx.restore();

    drawHUD();
  }
}

function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(0,0,W,28);
  // 醒目分数（左上，大号发光）
  ctx.save();
  ctx.shadowColor='rgba(255,215,106,.9)'; ctx.shadowBlur=10;
  ctx.fillStyle='#fff'; ctx.font='bold 20px sans-serif'; ctx.textAlign='left';
  ctx.fillText('SCORE', 12, 21);
  const sw=ctx.measureText('SCORE ').width;
  ctx.fillStyle='#ffe57a'; ctx.fillText(score, 12+sw, 21);
  ctx.restore();
  // 擦弹（右上）
  ctx.fillStyle='#bfe6ff'; ctx.font='12px sans-serif'; ctx.textAlign='right';
  ctx.fillText('擦弹 '+graze, W-10, 21);
  // 残机（心）
  ctx.textAlign='left';
  for(let i=0;i<lives;i++){ drawHeart(12+i*16, 46, 5, '#ff6a8a'); }
  // 符卡（大招次数）
  ctx.fillStyle='#7ed0ff'; ctx.font='12px sans-serif';
  ctx.fillText('符卡', 12, 62);
  for(let i=0;i<bombs;i++){ ctx.fillStyle='#7ed0ff'; ctx.fillText('✦', 48+i*14, 62); }
  // 擦弹充能（满即 +1 符卡）
  ctx.fillStyle='#fff'; ctx.font='10px sans-serif'; ctx.fillText('充能', 12, 76);
  ctx.fillStyle='rgba(255,255,255,.15)'; ctx.fillRect(48,72,88,5);
  ctx.fillStyle='#ffd76a'; ctx.fillRect(48,72,88*bombGauge/100,5);
  // 当前武器（左下角，避开顶部 Boss 血条）
  ctx.fillStyle='#9cff6a'; ctx.font='13px sans-serif'; ctx.textAlign='left';
  ctx.fillText('武器 '+WEAPONS[player.weapon]+'  '+WEAPON_HINT[player.weapon], 12, H-44);
}
function drawHeart(x,y,s,c){
  ctx.fillStyle=c; ctx.beginPath();
  ctx.moveTo(x,y+s*0.3);
  ctx.bezierCurveTo(x,y-s*0.5,x-s,y-s*0.5,x-s,y+s*0.2);
  ctx.bezierCurveTo(x-s,y+s*0.8,x,y+s*1.3,x,y+s*1.5);
  ctx.bezierCurveTo(x,y+s*1.3,x+s,y+s*0.8,x+s,y+s*0.2);
  ctx.bezierCurveTo(x+s,y-s*0.5,x,y-s*0.5,x,y+s*0.3);
  ctx.fill();
}

// ---------- 循环 ----------
function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}

// ---------- 流程 ----------
function startGame(){
  score=0; graze=0; lives=3; bombs=3; bombGauge=0; time=0;
  spawnTimer=30; waveCount=0; act=0; bossesDefeated=0; bossActive=false; boss=null;
  pBullets=[]; pShots=[]; enemies=[]; particles=[]; items=[]; floaters=[];
  spellAnim=null; spellOverlay.classList.remove('show','fadeout'); spellGif.src=''; spellName.textContent='';
  player.x=W/2; player.y=H-110; player.inv=120;
  state='playing';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('overScreen').classList.add('hidden');
}
function gameOver(win){
  state='over';
  const ov=document.getElementById('overScreen');
  document.getElementById('overTitle').textContent = win? '通关胜利' : '游戏结束';
  document.getElementById('overScore').textContent = 'SCORE '+score;
  document.getElementById('overInfo').textContent = '擦弹 '+graze+' 次 · 残机 '+Math.max(0,lives)+' · 符卡 '+bombs+' · 已击破 '+bossesDefeated+'/3';
  ov.classList.remove('hidden');
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('retryBtn').onclick=startGame;

// 胜利检测（在 update 里 boss 被击败后稍候）
setInterval(()=>{
  if(state==='playing' && bossesDefeated>=3 && !boss && pBullets.length<5 && enemies.length===0){
    gameOver(true);
  }
},500);

loop();
</script>
